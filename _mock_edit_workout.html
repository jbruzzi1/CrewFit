<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>CrewFit · Edit Workout (live-faithful)</title>
<style>
  :root { --bg:#f7f8fa; --card:#ffffff; --fg:#15181f; --muted:#6b7280; --green:#16a34a; --blue:#2563eb; --red:#dc2626; --line:#e6e8ec; --brand:#4f8cff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { max-width:480px; margin:0 auto; padding-bottom:calc(72px + env(safe-area-inset-bottom)); }
  .wrap { padding:14px; padding-left:calc(14px + env(safe-area-inset-left)); padding-right:calc(14px + env(safe-area-inset-right)); }
  .create-flow > .sec.sm { margin:0 0 14px; }
  .create-flow > h1 { margin:0 0 16px; }
  h1 { font-size:19px; margin:4px 0 2px; }
  h2 { font-size:13px; margin:24px 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
  .muted { color:var(--muted); font-size:12px; }
  button { font:inherit; border:none; border-radius:12px; padding:11px; background:var(--green); color:#fff; font-weight:600; width:100%; margin:6px 0; cursor:pointer; font-size:14px; }
  button.sec { background:var(--card); color:var(--fg); border:1px solid var(--line); }
  button.blue { background:var(--blue); color:#fff; }
  button.red { background:var(--red); color:#fff; }
  button.sm { padding:7px 12px; width:auto; font-size:12px; border-radius:9px; margin:0; }
  button.sm.gray { background:var(--card); color:var(--fg); border:1px solid var(--line); }
  input,select { width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); margin:5px 0; font:inherit; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:6px 12px; margin:10px 0; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  .tag { font-size:11px; color:var(--muted); }
  .lib-item { display:flex; justify-content:space-between; align-items:center; padding:10px 6px; border-bottom:1px solid var(--line); font-size:14px; }
  .lib-item:active { background:#f1f3f6; }
  .nav { position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; display:flex; background:var(--card); border-top:1px solid var(--line); box-shadow:0 -1px 4px rgba(0,0,0,.05); padding-bottom:env(safe-area-inset-bottom); }
  .nav button { background:transparent; color:#3a3f47; border-radius:0; margin:0; padding:8px 0 10px; font-size:11px; flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .nav button svg { display:block; }
  .nav button.active { color:var(--green); }
  .inv-row { display:flex; align-items:center; gap:12px; padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .inv-row:last-child { border-bottom:none; }
  .inv-row .inv-meta { flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:12px; }
  .inv-av-wrap { flex:0 0 auto; }
  .inv-av { width:40px; height:40px; border-radius:50%; object-fit:cover; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; }
  .inv-text { min-width:0; }
  .inv-text .name { font-weight:600; font-size:15px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .inv-text .handle { color:var(--muted); font-size:12px; }
  .check { position:relative; flex:0 0 auto; width:24px; height:24px; }
  .check input { opacity:0; width:0; height:0; }
  .check .box { position:absolute; inset:0; border:2px solid var(--line); border-radius:50%; background:transparent; transition:.15s; display:flex; align-items:center; justify-content:center; }
  .check .tick { width:13px; height:13px; opacity:0; transform:scale(.5); transition:.15s; }
  .check input:checked + .box { background:var(--green); border-color:var(--green); }
  .check input:checked + .box .tick { opacity:1; transform:scale(1); }
  .draft-ex { display:flex; align-items:center; justify-content:flex-start; gap:12px; padding:12px 6px; touch-action:pan-y; position:relative; transition:transform .16s ease; }
  .drag-handle { flex:0 0 auto; width:34px; height:34px; display:flex; align-items:center; justify-content:center; position:relative; color:var(--muted); border-radius:9px; cursor:grab; user-select:none; -webkit-user-select:none; touch-action:none; background:transparent; }
  .drag-handle::before { content:""; width:16px; height:12px; background:linear-gradient(#9ca3af,#9ca3af) left top/16px 2px no-repeat, linear-gradient(#9ca3af,#9ca3af) left center/16px 2px no-repeat, linear-gradient(#9ca3af,#9ca3af) left bottom/16px 2px no-repeat; }
  .draft-main { display:flex; align-items:center; gap:10px; min-width:0; cursor:pointer; flex:1; }
  .draft-name { flex:0 1 auto; min-width:0; font-weight:500; font-size:14px; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .draft-chip { flex:0 0 auto; font-size:13px; font-weight:500; color:var(--muted); }
  .draft-rm { flex:0 0 auto; margin-left:auto; background:transparent; color:var(--red); border:1px solid var(--red); font-size:12px; font-weight:600; padding:7px 12px; border-radius:10px; width:auto; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap create-flow">
  <button class="sec sm">← Cancel</button>
  <h1>Edit workout</h1>
  <label class="muted">Workout name</label><input id="wname" value="Chest & Back">
  <label class="muted">When</label><input id="dt" type="datetime-local" value="2026-08-08T17:30">
  <label class="muted">Location</label><input id="loc" value="Gold's Gym">
  <div class="row"><div><label class="muted">Length (min)</label><input id="len" type="number" inputmode="tel" pattern="[0-9]*" placeholder="60" value="60"></div></div>
  <label class="muted">Note to friends</label><input id="note" value="let's hit legs hard">
  <label class="muted">Visibility</label>
  <select id="vis"><option value="private">Private (invite only)</option><option value="friends">Friends-only (joinable)</option></select>
  <h2>Exercises</h2><div id="draftList" class="card">
    <div class="lib-item draft-ex" data-idx="0"><div class="drag-handle" title="Drag to reorder"></div><div class="draft-main"><span class="draft-name">Bench Press</span></div><button class="draft-rm">Remove</button></div>
    <div class="lib-item draft-ex" data-idx="1"><div class="drag-handle" title="Drag to reorder"></div><div class="draft-main"><span class="draft-name">Barbell Row</span><span class="draft-chip">3 x 10</span></div><button class="draft-rm">Remove</button></div>
    <div class="lib-item draft-ex" data-idx="2"><div class="drag-handle" title="Drag to reorder"></div><div class="draft-main"><span class="draft-name">Lat Pulldown</span><span class="draft-chip">4 x 8</span></div><button class="draft-rm">Remove</button></div>
  </div>
  <button class="sec" onclick="openAddExercises()">+ Add exercise</button>
  <button class="sec sm" onclick="templatesPage()">Browse templates</button>
  <button class="sec sm" onclick="tplQuickSaveSheet()">Save as template</button>
  <h2>Invite friends</h2><div id="invList" class="card">
    <label class="inv-row"><div class="inv-meta"><div class="inv-av-wrap"><div class="inv-av" style="background:#4f8cff;color:#fff">B</div></div><div class="inv-text"><div class="name">Brian</div><div class="handle">@brian</div></div></div><span class="check"><input type="checkbox" checked><span class="box"><svg class="tick" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3.5 8.5l3 3 6-7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span></label>
    <label class="inv-row"><div class="inv-meta"><div class="inv-av-wrap"><div class="inv-av" style="background:#9333ea;color:#fff">S</div></div><div class="inv-text"><div class="name">Sam</div><div class="handle">@sam</div></div></div><span class="check"><input type="checkbox"><span class="box"><svg class="tick" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3.5 8.5l3 3 6-7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span></label>
  </div>
  <button class="blue" onclick="submitSession()">Save changes</button>
</div>
<div class="nav hidden" id="nav">
  <button data-tab="home" class="active"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Home</span></button>
  <button data-tab="lib"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11"/><path d="M21 21l-1-1"/><path d="M3 3l1 1"/><path d="M9 9l1 1"/><path d="M15 15l1 1"/><rect x="4" y="4" width="4" height="4" rx="1" transform="rotate(45 6 6)"/><rect x="16" y="16" width="4" height="4" rx="1" transform="rotate(45 18 18)"/></svg><span>Workouts</span></button>
  <button data-tab="friends"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Friends</span></button>
  <button data-tab="me"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profile</span></button>
</div>
</body>
</html>
