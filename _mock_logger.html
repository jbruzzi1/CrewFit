<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CrewFit · Logger Mock v2 (APPROVED SPEC)</title>
<style>
  :root{ --bg:#f5f6f8; --card:#fff; --fg:#16181d; --muted:#8a909a; --line:#e7e9ee; --brand:#4f8cff; --blue:#2563eb; --red:#dc2626; --green:#10b981; }
  *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--fg)}
  .iphone{max-width:390px;margin:0 auto;background:var(--bg);min-height:100vh;padding:16px 16px 40px}
  .head{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 14px}
  .back{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--muted)}
  .date{font-size:20px;font-weight:700;margin:0}
  .ex-block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .ex-block h3{margin:0 0 2px;font-size:16px}
  .ex-sub{font-size:13px;color:var(--muted);margin-bottom:10px}
  .ex-sub b{color:var(--fg);font-weight:700}
  .set-row{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);font-size:14px}
  .set-row:active{background:#f1f3f6}
  .set-n{width:30px;font-weight:700;color:var(--muted)}
  .set-vals{flex:1;min-width:0}
  .set-vals b{font-size:15px}
  .set-vals .sub{font-size:12px;color:var(--muted)}
  .type-tag{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px}
  .t-normal{background:#eef1f5;color:var(--muted)}
  .t-warm{background:rgba(37,99,235,.12);color:var(--blue)}
  .t-drop{background:rgba(147,51,234,.12);color:#9333ea}
  .t-fail{background:rgba(220,38,38,.12);color:var(--red)}
  .type-tag.pr{background:rgba(245,158,11,.15);color:#b45309}
  .seg{display:flex;gap:6px;margin:14px 0 14px}
  .seg .chip{flex:1;text-align:center;background:#eef1f5;color:var(--muted);border-radius:999px;padding:9px 0;font-size:12px;font-weight:600}
  .seg .chip.on{background:var(--blue);color:#fff}
  .add-row{display:flex;gap:8px;align-items:center;width:100%;margin-top:2px}
  .add-row input{flex:1 1 0;min-width:0;max-width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;box-sizing:border-box;background:#fbfbfc;color:var(--fg)}
  .add-row input::placeholder{color:#aeb4be}
  .add-btn{flex:0 0 auto;background:transparent;color:var(--blue);border:1px solid var(--blue);border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600}
  .add-btn:active{background:rgba(37,99,235,.08)}
  .rest{display:inline-flex;gap:8px;margin-top:14px;padding:8px 12px;background:#eef1f5;border-radius:999px;font-size:12px;color:var(--muted)}
  .rest b{color:var(--fg);font-size:14px;font-weight:700}
  .note{font-size:11px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<div class="iphone">
  <div class="head"><button class="back">← Back</button><h1 class="date">Sat, Aug 8</h1></div>
  <div class="ex-block">
    <h3>Bench Press</h3>
    <div class="ex-sub">Last time: <b>185 × 8</b></div>
    <div class="set-row"><div class="set-n">1</div><div class="set-vals"><b>135 lbs</b> · <span class="sub">10 reps</span></div><span class="type-tag t-warm">Warm up</span></div>
    <div class="set-row"><div class="set-n">2</div><div class="set-vals"><b>185 lbs</b> · <span class="sub">8 reps</span></div><span class="type-tag t-normal">Normal</span><span class="type-tag pr">PR</span></div>
    <div class="set-row"><div class="set-n">3</div><div class="set-vals"><b>205 lbs</b> · <span class="sub">3 reps</span></div><span class="type-tag t-drop">Drop</span></div>
    <div class="set-row"><div class="set-n">4</div><div class="set-vals"><b>135 lbs</b> · <span class="sub">12 reps</span></div><span class="type-tag t-fail">Failure</span></div>
    <div class="seg">
      <div class="chip on">Normal</div><div class="chip">Warm up</div><div class="chip">Drop</div><div class="chip">Failure</div>
    </div>
    <div class="add-row"><input placeholder="lbs" type="number" inputmode="tel" pattern="[0-9]*"><input placeholder="reps" type="number" inputmode="tel" pattern="[0-9]*"><button class="add-btn">+ Add</button></div>
    <div class="rest"><span>Rest</span><b>0:42</b><span>· tap to dismiss</span></div>
    <div class="note">Tap a set to edit or delete it. Set # auto-fills.</div>
  </div>
</div>
</body>
</html>
