# Fly.io config for CrewFit (brand working-name; deploy handle below is 'spotmeapp' placeholder)
#
# Oct 19 2026 (Phase 3 Slice 2, "doomsday" infra): the persistent volume this comment used to
# describe ("1 GB persistent volume at /data so data.json survives restarts") is GONE as of this
# change -- see CLAUDE.md's Phase 3 Slice 2 section for the full story. Everything that volume
# used to hold is now either a Fly secret (AUTH_SECRET, VAPID_PUBLIC_KEY/VAPID_PRIVATE_KEY,
# ADMIN_TOKEN) or lives in Supabase Storage (SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY/
# SUPABASE_STORAGE_BUCKET -- photos/avatars and boot-time backups, via storage.js). DATA_DIR=/data
# stays set below (and the Dockerfile still creates that directory in the image) purely as the
# fallback path those same features use if any of those env vars were ever unset again -- it's
# just a normal, non-persistent directory in the container's own writable layer now, not a
# mounted volume. A machine with no volume dependency is what makes it actually replaceable on a
# host failure, which was the whole point of this slice.
#
# Removing [mounts] and redeploying replaces the running Machine with one that has no volume
# attached (confirmed against Fly's own docs before this change shipped). The volume itself
# ("spotmeapp_data") is NOT destroyed by this -- it sits around, detached, as a safety net for a
# while before anyone runs `fly volumes destroy` on it. See CLAUDE.md for the exact commands and
# the reasoning for the grace period.

app = 'spotmeapp'
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

# Fly ignores the HEALTHCHECK in the Dockerfile — this is the one that counts. /healthz
# asserts the database actually loaded (it used to return a constant {ok:true}, which would
# have passed over an empty database). A machine that fails this is not put into service.
[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "20s"
  method = "GET"
  path = "/healthz"

# Oct 12 2026 (deep-dive audit, Jeff: "let's correct everything" -> infra redundancy item):
# bumped from Fly's smallest tier (256MB) to 512MB. server.js keeps the ENTIRE database in an
# in-memory `DB` object (see HANDOFF.md section 2.5) -- every user, session, and set ever logged
# lives in process RAM at once, not paged from Postgres per-request, so memory headroom scales
# with the app's own data, not just request volume. 256MB leaves very little slack above that
# baseline plus Node's own runtime overhead; 512MB buys real headroom without a meaningful cost
# jump ($2.19/mo -> $3.69/mo on Fly's shared-cpu-1x pricing, confirmed against fly.io's current
# pricing page -- about $1.50/month more). Cheap insurance against an out-of-memory crash as the
# user base grows post-launch, not a fix for a problem already observed in production.
[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
