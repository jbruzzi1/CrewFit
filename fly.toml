# Fly.io config for CrewFit (brand working-name; deploy handle below is 'spotmeapp' placeholder)
# Always-on (Launch plan) + 1 GB persistent volume at /data so data.json survives
# restarts. The volume "spotmeapp_data" is created via:
#   fly volumes create spotmeapp_data --region iad --size 1 --app spotmeapp

app = 'spotmeapp'
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  NODE_ENV = "production"

[mounts]
  source = "spotmeapp_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

# Fly ignores the HEALTHCHECK in the Dockerfile — this is the one that counts. /healthz
# asserts the database actually loaded (it used to return a constant {ok:true}, which would
# have passed over an empty database). A machine that fails this is not put into service.
[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "20s"
  method = "GET"
  path = "/healthz"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
