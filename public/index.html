<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f7f8fa" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <!-- without this every first load asks for /favicon.ico and takes a 404 -->
  <link rel="icon" href="/icon-192.png" />
  <title>CrewFit</title>
  <style>
    :root { --bg:#fbfbfd; --card:#ffffff; --fg:#15181f; --muted:#6b7280; --green:#16a34a; --blue:#2563eb; --red:#dc2626; --line:#edeff2; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; padding:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { max-width:480px; margin:0 auto; padding-bottom:calc(72px + env(safe-area-inset-bottom)); }
    .wrap { padding:14px; padding-left:calc(14px + env(safe-area-inset-left)); padding-right:calc(14px + env(safe-area-inset-right)); padding-bottom:calc(84px + env(safe-area-inset-bottom)); }
    .create-flow > .sec.sm { margin:0 0 14px; }            /* Cancel button -> gap below */
    .create-flow > h1 { margin:0 0 16px; }                  /* New workout title -> gap below */
    .tpl-name-edit { width:100%; margin:0 0 16px; font-size:19px; font-weight:700; line-height:1.2; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--text); box-sizing:border-box; }
    .tpl-name-edit:focus { outline:none; border-color:var(--green); }
    .create-flow > label.muted:first-of-type { margin-top:0; }
    h1 { font-size:19px; margin:4px 0 2px; }
    .sess-date { margin:18px 0 4px; }
    .sess-meta { margin:0 0 12px; }
    .sess-actions { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0 4px; }
    .sess-actions .sm { width:auto; background:transparent; border:1px solid #b0b6c0; color:var(--fg); font-weight:600; }
    .sess-actions .sm.blue { border-color:#bcd4fb; color:#2563eb; background:#e8f1ff; }
    .sess-actions .sm.red { border-color:#f1b9b9; color:#dc2626; background:#fbe9e9; }
    .sess-actions .sm.sec { border-color:#b0b6c0; color:var(--fg); background:transparent; }
    .home-head { padding-top:calc(22px + env(safe-area-inset-top)); }
    .home-top { display:flex; align-items:center; justify-content:space-between; margin:0 0 16px; }
    .home-brand { font-size:20px; font-weight:700; letter-spacing:.2px; }
    .home-avatar { width:44px; height:44px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; cursor:pointer; object-fit:cover; overflow:hidden; box-shadow:0 2px 8px rgba(22,163,74,.25); }
    .home-greet { font-size:19px; color:var(--fg); font-weight:700; }
    .act-chip { flex:0 0 auto; font-size:11px; font-weight:700; border-radius:999px; padding:3px 8px; vertical-align:middle; }
    .act-chip.pr { background:rgba(245,158,11,.15); color:#b45309; }
    .act-chip.done { background:rgba(16,185,129,.15); color:var(--green); }
    .btn-new { padding:13px 18px; font-size:14px; border-radius:14px; margin:16px 0 8px; width:auto; align-self:flex-start; box-shadow:0 4px 12px rgba(37,99,235,.25); }
    h2 { font-size:12px; margin:28px 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; font-weight:600; }
    h2.light { margin:24px 0 8px; }
    h2.pt { margin-top:84px; }
    h2.sep { margin-top:28px; padding-top:18px; border-top:1px solid var(--line); }
    .inv-banner { background:#f4f8ff; border:1px solid #dbe7fb; border-radius:14px; padding:10px 12px; margin:0 0 16px; }
    .inv-empty { font-size:12.5px; color:var(--muted); background:#f4f6f9; border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin:0 0 16px; }
    /* A pending invite on the home screen. Deliberately NOT called .inv-row: that name belongs to
       the friend picker in New Workout further down this file, and while these two shared it the
       picker's padding, gap and border-bottom silently applied here — two invites drew a double
       divider, and the picker's cursor:pointer was the only reason this looked tappable. */
    /* padding is on the row, not on the sibling, so BOTH rows press with the same shaped highlight;
       the negative margin lets that highlight and the divider run the full width of the banner */
    .inv-card { display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; border-radius:10px; padding:8px 6px; margin:0 -6px; }
    .inv-card:active { background:#e8f1ff; }
    /* pressing Accept or Decline must NOT flash "opening the workout" at you — :active matches
       ancestors, so the row lights up for a button press unless this cancels it */
    .inv-card:has(.inv-actions:active) { background:transparent; }
    .inv-card + .inv-card { border-top:1px solid #e6eefb; }
    .inv-info { font-size:13px; color:var(--fg); line-height:1.35; }
    .inv-info .tag { margin-top:2px; }
    /* the row opens the workout — say so, since a phone has no cursor to hint with */
    .inv-open { font-size:11.5px; font-weight:600; color:var(--blue); margin-top:4px; }
    /* .row also sets a gap and is declared later, so this has to be .row.inv-actions to win */
    .row.inv-actions { justify-content:flex-end; gap:6px; flex:0 0 auto; }
    /* the two buttons are a pair, so they must be one size: .gray carries a real 1px border and
       .blue does not, which made them 2px different in both dimensions and 1px off each other */
    .inv-actions button.sm { border:1px solid transparent; }
    .inv-actions button.sm:active { filter:brightness(.93); }
    .feed-strip { display:flex; flex-direction:column; gap:2px; }
    .feed-item { font-size:13px; color:var(--fg); line-height:1.5; padding:7px 0; border-bottom:1px solid var(--line); }
    .feed-item:last-child { border-bottom:none; }
    .muted { color:var(--muted); font-size:12px; }
    .sm-text { font-size:11px; }
    .swap-note { font-size:11px; color:var(--muted); font-weight:400; }
    button { font:inherit; border:none; border-radius:12px; padding:11px; background:var(--green); color:#fff; font-weight:600; width:100%; margin:6px 0; cursor:pointer; font-size:14px; }
    button.sec { background:var(--card); color:var(--fg); border:1px solid var(--line); }
    button.blue { background:var(--blue); color:#fff; }
    button.red { background:var(--red); color:#fff; }
    button.sm { padding:7px 12px; width:auto; font-size:12px; border-radius:9px; margin:0; }
    button.sm.gray { background:var(--card); color:var(--fg); border:1px solid var(--line); }
    .tpl-actions { display:flex; justify-content:center; gap:10px; margin-top:10px; }
    .linkbtn { background:transparent; color:var(--blue); font-weight:600; width:auto; padding:5px; margin:0; font-size:13px; }
    input,select { width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); margin:5px 0; font:inherit; font-size:14px; }
    textarea { width:100%; box-sizing:border-box; padding:9px 11px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; font-size:13px; resize:none; min-height:60px; }
    .btn-primary { width:100%; box-sizing:border-box; margin-top:18px; padding:14px; border-radius:12px; border:none; background:var(--blue); color:#fff; font:inherit; font-size:15px; font-weight:700; cursor:pointer; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:8px 14px; margin:12px 0; box-shadow:0 6px 18px rgba(20,24,31,.06); }
    .notes-box { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 11px; margin:10px 0; font-family:inherit; font-size:13px; line-height:1.45; color:var(--fg); min-height:60px; box-sizing:border-box; }
    /* Posted-workout (read-only post) view */
    .pp-head { display:flex; align-items:center; justify-content:space-between; gap:10px; position:relative; }
    .pp-dots { background:transparent; border:none; font-size:22px; line-height:1; color:var(--fg); cursor:pointer; padding:2px 8px; border-radius:8px; width:auto; flex:0 0 auto; margin-left:auto; }
    .pp-dots:active { background:#f1f3f6; }
    .pp-menu { position:absolute; top:40px; right:0; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.12); z-index:20; min-width:170px; overflow:hidden; }
    .pp-menu button { display:block; width:100%; text-align:left; background:transparent; border:none; padding:12px 15px; font-size:14px; color:var(--fg); cursor:pointer; }
    .pp-menu button:active { background:#f1f3f6; }
    .pp-menu button.danger { color:#d23; }
    .pp-photos { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; border-radius:12px; scrollbar-width:none; }
    .pp-photos::-webkit-scrollbar { display:none; }
    .pp-photos img, .pp-photos video { flex:0 0 100%; width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px; display:block; background:#e6e8ec; scroll-snap-align:start; }
    .pp-photo { position:relative; flex:0 0 100%; }
    .pp-photo-x { position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; border:none; font-size:15px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:5; }
    .pp-photo-dots { display:flex; gap:6px; justify-content:center; margin-top:8px; }
    .pp-photo-dots .pp-dot { width:6px; height:6px; border-radius:50%; background:#cfd4da; transition:background .15s; }
    .pp-photo-dots .pp-dot.on { background:var(--blue); }
    .pp-ex { display:flex; justify-content:space-between; align-items:center; padding:11px 4px; border-bottom:1px solid var(--line); }
    .pp-ex:last-child { border-bottom:none; }
    .pp-ex-name { font-size:14px; font-weight:600; color:var(--fg); }
    .pp-sets { margin:5px 0 2px; padding-left:2px; }
    /* whose sets these are — only rendered when more than one person logged, so a solo
       workout is byte-identical to how it looked before */
    .pp-who { font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase;
              letter-spacing:.5px; margin:9px 0 1px; padding-left:2px; }
    /* the lift as it was named when THEY logged it, if a swap has since renamed it */
    .pp-who-note { font-weight:600; text-transform:none; letter-spacing:0; opacity:.8; }
    .pp-set { display:flex; align-items:center; gap:8px; padding:3px 0; font-size:13px; }
    .pp-set-n { width:22px; height:22px; border-radius:6px; background:#eef1f5; color:var(--muted); font-size:11px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
    .pp-set-n.warm { background:#fff3e0; color:#b26a00; }
    .pp-set-n.drop { background:#ffe8e0; color:#c2410c; }
    .pp-set-n.fail { background:#fde2e2; color:#b91c1c; }
    .pp-set-val { color:var(--fg); }
    .pp-pr { font-size:10px; font-weight:700; color:#b8860b; background:#fff8e1; border-radius:6px; padding:1px 6px; }
    .pp-collab { font-size:12px; color:var(--blue); margin:2px 0 10px; }
    .row { display:flex; gap:8px; align-items:center; }
    .row > * { flex:1; }
    .chat-row { align-items:center; }
    .chat-row > * { flex:initial; }
    .chat-input { flex:1; height:44px; padding:0 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; font-size:14px; }
    .chat-row .chat-send { flex:0 0 auto; height:44px; display:flex; align-items:center; justify-content:center; padding:0 18px; line-height:1; border-radius:12px; background:#e8f1ff; color:var(--blue); border:1px solid #bcd4fb; font-weight:600; }
    .pill { display:inline-block; background:#eef1f5; border-radius:999px; padding:3px 9px; font-size:11px; margin:3px 4px 3px 0; color:var(--muted); }
    .tag { font-size:11px; color:var(--muted); }
    .hidden { display:none !important; }
    .scrolllist { max-height:46vh; overflow:auto; }
    .lib-item { display:flex; justify-content:space-between; align-items:center; padding:10px 6px; border-bottom:1px solid var(--line); font-size:14px; }
    .lib-item:active { background:#f1f3f6; }
    .lib-item { gap:10px; }
    .card > .lib-item:last-child, .scrolllist > .lib-item:last-child { border-bottom:none; }
    .mw-thumb { width:52px; height:52px; border-radius:10px; object-fit:cover; flex:0 0 auto; background:#e9edf2; }
    .badge { background:var(--blue); color:#fff; border-radius:999px; padding:2px 8px; font-size:11px; }
    .chips { display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin:8px 0 4px; }
    .chips .lbl { color:var(--muted); font-size:11px; margin-right:2px; }
    .chip { background:#eef1f5; color:var(--fg); border:1px solid var(--line); border-radius:999px; padding:5px 10px; font-size:12px; cursor:pointer; }
    .chip.on { background:var(--blue); color:#fff; border-color:var(--blue); }
    .chips.mini { gap:8px; }
    .fav { display:inline-flex; align-items:center; gap:7px; background:#eef1f5; border:1px solid var(--line); border-radius:999px; padding:4px 11px 4px 4px; }
    .fav-av { width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:0 0 auto; }
    /* Comments thread */
    .cmt { display:flex; gap:9px; padding:9px 6px; border-bottom:1px solid var(--line); }
    .cmt:last-child { border-bottom:none; }
    .cmt-av { width:30px; height:30px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:0 0 auto; }
    .cmt-body { flex:1 1 auto; min-width:0; }
    .cmt-top { display:flex; align-items:center; gap:8px; }
    .cmt-top b { font-size:13px; }
    .cmt-text { font-size:13px; color:var(--fg); margin-top:2px; line-height:1.35; word-wrap:break-word; }
    /* ---- Save workout page ---- */
    .card.center-v { padding:14px; line-height:1.4; }
    .add-media { display:inline-flex; align-items:center; justify-content:center; width:64px; height:64px; border-radius:12px; border:1px solid var(--line); background:#fafbfc; color:var(--blue); cursor:pointer; position:relative; flex:0 0 auto; vertical-align:middle; }
    .add-media .am-ic { width:28px; height:28px; }
    .add-media .am-plus { position:absolute; right:-5px; bottom:-5px; width:20px; height:20px; border-radius:50%; background:var(--blue); border:2px solid #fff; display:flex; align-items:center; justify-content:center; }
    .add-media .am-plus::before, .add-media .am-plus::after { content:''; position:absolute; background:#fff; border-radius:1px; }
    .add-media .am-plus::before { width:9px; height:2px; }
    .add-media .am-plus::after { width:2px; height:9px; }
    .media-line { display:flex; align-items:center; justify-content:flex-start; gap:8px; flex-wrap:nowrap; line-height:normal; }
    .media-line .ml-text { font-size:13px; color:var(--fg); font-weight:600; }
    .thumbs { display:flex; gap:8px; margin:0; flex-wrap:nowrap; flex:0 0 auto; }
    .thumbs:empty { display:none; }
    .thumb { width:64px; height:64px; border-radius:10px; background:#e9edf2; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted); position:relative; overflow:hidden; flex:0 0 auto; }
    .thumb img, .thumb video { width:100%; height:100%; object-fit:cover; }
    .thumb .x { position:absolute; top:2px; right:4px; color:#fff; background:rgba(0,0,0,.5); border-radius:50%; width:17px; height:17px; display:flex; align-items:center; justify-content:center; font-size:10px; }
    .tab-note { font-size:11px; color:var(--muted); margin-top:8px; }
    .fineprint { font-size:10.5px; color:#9aa1ad; line-height:1.45; padding:7px 2px 0; letter-spacing:.1px; }
    .fav span { font-size:13px; font-weight:600; color:var(--fg); }
    .ex-card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 14px 12px; margin:13px 0; box-shadow:0 1px 3px rgba(0,0,0,.04); }
    .ex-card.log-row { cursor:pointer; }
    .ex-card.log-row:active { background:#f1f3f6; }
    .ex-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .ex-card .ex-main { flex:1 1 auto; min-width:0; }
    .ex-card .ex-name { font-size:15px; line-height:1.3; }
    .ex-card .logged { display:block; margin-top:6px; padding-left:2px; font-size:12px; font-weight:600; color:var(--green); }
    .ex-card .log-hint { display:block; margin-top:6px; padding-left:2px; margin-bottom:6px; font-size:12px; font-weight:600; color:var(--blue); }
    /* what your training partner has done on this lift while you are both in the gym */
    .ex-card .ex-crew { display:block; margin-top:4px; padding-left:2px; font-size:11.5px; color:var(--muted); }
    .ex-card .ex-meta { flex:0 0 auto; display:flex; align-items:center; }
    .ex-card .tag { font-size:12px; color:var(--muted); white-space:nowrap; }
    .ex-card .req { margin-top:10px; padding-top:10px; padding-bottom:0; border-top:1px solid var(--line); }
    /* iOS Safari repaints position:fixed elements lazily during momentum scrolling and while
       the address bar collapses, so the bar visibly drifts up the page mid-scroll and snaps
       back at rest. Promoting it to its own compositor layer makes it track the viewport
       every frame. translateZ(0) does NOT create a containing block for its own fixed
       positioning (only for fixed DESCENDANTS), so the bar stays pinned. */
    .nav { position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; display:flex; background:var(--card); border-top:1px solid var(--line); box-shadow:0 -2px 10px rgba(0,0,0,.04); padding-bottom:env(safe-area-inset-bottom);
           transform:translateZ(0); -webkit-transform:translateZ(0); will-change:transform;
           -webkit-backface-visibility:hidden; backface-visibility:hidden; z-index:40; }
    .nav button { background:transparent; color:#3a3f47; border-radius:0; margin:0; padding:8px 0 10px; font-size:10px; flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
    .nav button svg { display:block; }
    .nav button.active { color:var(--blue); }
    .req { display:flex; align-items:center; gap:10px; padding:8px 0; }
    .req .av { width:30px; height:30px; border-radius:50%; background:var(--green); color:#04130a; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:0 0 auto; }
    .req .rc { flex:1; font-size:12px; line-height:1.35; color:var(--fg); }
    .req .ra { display:flex; gap:6px; flex:0 0 auto; }
    .req .ra .sm { background:transparent; border:1px solid var(--line); color:var(--fg); font-weight:600; font-size:12px; padding:2px 10px; width:auto; margin:0; }
    .req .ra .sm.ok, .req .ra .sm.no { color:var(--fg); border-color:var(--line); background:#f4f5f7; }
    .center { text-align:center; padding-top:30px; }
    .avatar { width:44px; height:44px; border-radius:50%; background:var(--green); color:#04130a; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:17px; flex:0 0 auto; }
    .friend-row { display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); }
    .friend-row:last-child { border-bottom:none; }
    .friend-row .meta { flex:1 1 auto; min-width:0; }
    .friend-row .name { font-weight:600; font-size:15px; line-height:1.2; }
    .friend-row .handle { color:var(--muted); font-size:12px; }
    /* Invite friends list (New Workout) — compact iOS-style rows w/ checkmark */
    .inv-row { display:flex; align-items:center; gap:12px; padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
    .inv-row:last-child { border-bottom:none; }
    .inv-row .inv-meta { flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:12px; }
    .inv-av-wrap { flex:0 0 auto; }
    .inv-av { width:40px; height:40px; border-radius:50%; object-fit:cover; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; }
    .inv-text { min-width:0; }
    .inv-text .name { font-weight:600; font-size:15px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .inv-text .handle { color:var(--muted); font-size:12px; }
    .check { position:relative; flex:0 0 auto; width:24px; height:24px; }
    .check input { opacity:0; width:0; height:0; }
    .check .box { position:absolute; inset:0; border:2px solid var(--line); border-radius:50%; background:transparent; transition:.15s; display:flex; align-items:center; justify-content:center; }
    .check .tick { width:13px; height:13px; opacity:0; transform:scale(.5); transition:.15s; }
    .check input:checked + .box { background:var(--green); border-color:var(--green); }
    .check input:checked + .box .tick { opacity:1; transform:scale(1); }
    .streak-pill { display:inline-flex; align-items:center; gap:3px; background:#fff4ec; color:#e8590c; border-radius:999px; padding:3px 9px; font-size:12px; font-weight:600; margin-top:3px; }
    .streak-pill svg { width:13px; height:13px; }
    .add-row { display:flex; gap:8px; align-items:center; margin:0 0 4px; }
    .add-row input { flex:1; margin:0; }
    .add-row button { width:auto; margin:0; }
    /* padding-left 0 so the avatar shares the 14px left edge of everything below it */
    .profile-head { display:flex; align-items:center; gap:16px; padding:6px 0 14px; position:relative; }
    .profile-set { position:absolute; top:2px; right:0; width:40px; height:40px; border-radius:50%; border:none; background:transparent; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
    .profile-set:active { background:#f1f3f6; }
    .sheet-list { display:flex; flex-direction:column; margin-top:4px; }

    .sheet-head { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
