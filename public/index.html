<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f7f8fa" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>CrewFit</title>
  <style>
    :root { --bg:#f7f8fa; --card:#ffffff; --fg:#15181f; --muted:#6b7280; --green:#16a34a; --blue:#2563eb; --red:#dc2626; --line:#e6e8ec; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; padding:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { max-width:480px; margin:0 auto; padding-bottom:calc(72px + env(safe-area-inset-bottom)); }
    .wrap { padding:14px; padding-left:calc(14px + env(safe-area-inset-left)); padding-right:calc(14px + env(safe-area-inset-right)); }
    .create-flow > .sec.sm { margin:0 0 14px; }            /* Cancel button -> gap below */
    .create-flow > h1 { margin:0 0 16px; }                  /* New workout title -> gap below */
    .tpl-name-edit { width:100%; margin:0 0 16px; font-size:19px; font-weight:700; line-height:1.2; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--text); box-sizing:border-box; }
    .tpl-name-edit:focus { outline:none; border-color:var(--green); }
    .create-flow > label.muted:first-of-type { margin-top:0; }
    h1 { font-size:19px; margin:4px 0 2px; }
    .sess-date { margin:18px 0 4px; }
    .sess-meta { margin:0 0 12px; }
    .sess-actions { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0 4px; }
    .sess-actions .sm { width:auto; background:transparent; border:1px solid #b0b6c0; color:var(--fg); font-weight:600; }
    .sess-actions .sm.blue { border-color:#bcd4fb; color:#2563eb; background:#e8f1ff; }
    .sess-actions .sm.red { border-color:#f1b9b9; color:#dc2626; background:#fbe9e9; }
    .sess-actions .sm.sec { border-color:#b0b6c0; color:var(--fg); background:transparent; }
    .home-head { padding-top:calc(20px + env(safe-area-inset-top)); }
    .home-top { display:flex; align-items:center; justify-content:space-between; margin:0 0 20px; }
    .home-brand { font-size:20px; font-weight:700; letter-spacing:.2px; }
    .home-avatar { width:40px; height:40px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700; cursor:pointer; object-fit:cover; overflow:hidden; box-shadow:0 0 0 3px var(--card), 0 0 0 4px var(--line); }
    .home-greet { font-size:15px; color:var(--text); margin-top:4px; font-weight:600; }
    .act-chip { flex:0 0 auto; font-size:11px; font-weight:700; border-radius:999px; padding:3px 8px; vertical-align:middle; }
    .act-chip.pr { background:rgba(245,158,11,.15); color:#b45309; }
    .act-chip.done { background:rgba(16,185,129,.15); color:var(--green); }
    .btn-hero { padding:15px; font-size:15px; border-radius:14px; margin:0 0 22px; }
    h2 { font-size:13px; margin:24px 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
    h2.pt { margin-top:84px; }
    h2.sep { margin-top:28px; padding-top:18px; border-top:1px solid var(--line); }
    .muted { color:var(--muted); font-size:12px; }
    .sm-text { font-size:11px; }
    .swap-note { font-size:11px; color:var(--muted); font-weight:400; }
    button { font:inherit; border:none; border-radius:12px; padding:11px; background:var(--green); color:#fff; font-weight:600; width:100%; margin:6px 0; cursor:pointer; font-size:14px; }
    button.sec { background:var(--card); color:var(--fg); border:1px solid var(--line); }
    button.blue { background:var(--blue); color:#fff; }
    button.red { background:var(--red); color:#fff; }
    button.sm { padding:7px 12px; width:auto; font-size:12px; border-radius:9px; margin:0; }
    button.sm.gray { background:var(--card); color:var(--fg); border:1px solid var(--line); }
    .tpl-actions { display:flex; justify-content:center; gap:10px; margin-top:10px; }
    .linkbtn { background:transparent; color:var(--blue); font-weight:600; width:auto; padding:5px; margin:0; font-size:13px; }
    input,select { width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); margin:5px 0; font:inherit; font-size:14px; }
    textarea { width:100%; box-sizing:border-box; padding:9px 11px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; font-size:13px; resize:none; min-height:60px; }
    .btn-primary { width:100%; box-sizing:border-box; margin-top:18px; padding:14px; border-radius:12px; border:none; background:var(--blue); color:#fff; font:inherit; font-size:15px; font-weight:700; cursor:pointer; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:6px 12px; margin:10px 0; box-shadow:0 1px 3px rgba(0,0,0,.05); }
    .row { display:flex; gap:8px; align-items:center; }
    .row > * { flex:1; }
    .chat-row { align-items:center; }
    .chat-row > * { flex:initial; }
    .chat-input { flex:1; height:44px; padding:0 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; font-size:14px; }
    .chat-row .chat-send { flex:0 0 auto; height:44px; display:flex; align-items:center; justify-content:center; padding:0 18px; line-height:1; border-radius:12px; background:#eafaf0; color:var(--green); border:1px solid #b7e4c7; font-weight:600; }
    .pill { display:inline-block; background:#eef1f5; border-radius:999px; padding:3px 9px; font-size:11px; margin:3px 4px 3px 0; color:var(--muted); }
    .tag { font-size:11px; color:var(--muted); }
    .hidden { display:none !important; }
    .scrolllist { max-height:46vh; overflow:auto; }
    .lib-item { display:flex; justify-content:space-between; align-items:center; padding:10px 6px; border-bottom:1px solid var(--line); font-size:14px; }
    .lib-item:active { background:#f1f3f6; }
    .lib-item { gap:10px; }
    .mw-thumb { width:52px; height:52px; border-radius:10px; object-fit:cover; flex:0 0 auto; background:#e9edf2; }
    .badge { background:var(--blue); color:#fff; border-radius:999px; padding:2px 8px; font-size:11px; }
    .chips { display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin:8px 0 4px; }
    .chips .lbl { color:var(--muted); font-size:11px; margin-right:2px; }
    .chip { background:#eef1f5; color:var(--fg); border:1px solid var(--line); border-radius:999px; padding:5px 10px; font-size:12px; cursor:pointer; }
    .chip.on { background:var(--blue); color:#fff; border-color:var(--blue); }
    .chips.mini { gap:8px; }
    .fav { display:inline-flex; align-items:center; gap:7px; background:#eef1f5; border:1px solid var(--line); border-radius:999px; padding:4px 11px 4px 4px; }
    .fav-av { width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:0 0 auto; }
    /* ---- Save workout page ---- */
    .card.center-v { text-align:center; padding:16px 14px; line-height:0; }
    .add-media { display:inline-flex; align-items:center; justify-content:center; width:58px; height:58px; border-radius:12px; border:1px solid var(--line); background:#fafbfc; color:var(--blue); cursor:pointer; position:relative; flex:0 0 auto; vertical-align:middle; }
    .add-media .am-ic { width:26px; height:26px; }
    .add-media .am-plus { position:absolute; right:-5px; bottom:-5px; width:20px; height:20px; border-radius:50%; background:var(--blue); border:2px solid #fff; display:flex; align-items:center; justify-content:center; }
    .add-media .am-plus::before, .add-media .am-plus::after { content:''; position:absolute; background:#fff; border-radius:1px; }
    .add-media .am-plus::before { width:9px; height:2px; }
    .add-media .am-plus::after { width:2px; height:9px; }
    .media-line { display:inline-flex; align-items:center; justify-content:center; gap:12px; vertical-align:middle; line-height:normal; }
    .media-line .ml-text { font-size:13px; color:var(--fg); font-weight:600; }
    .thumbs { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; justify-content:center; }
    .thumbs:empty { display:none; }
    .thumb { width:66px; height:66px; border-radius:10px; background:#e9edf2; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted); position:relative; overflow:hidden; }
    .thumb img, .thumb video { width:100%; height:100%; object-fit:cover; }
    .thumb .x { position:absolute; top:2px; right:4px; color:#fff; background:rgba(0,0,0,.5); border-radius:50%; width:17px; height:17px; display:flex; align-items:center; justify-content:center; font-size:10px; }
    .tab-note { font-size:11px; color:var(--muted); margin-top:8px; }
    .fineprint { font-size:10.5px; color:#9aa1ad; line-height:1.45; padding:7px 2px 0; letter-spacing:.1px; }
    .fav span { font-size:13px; font-weight:600; color:var(--fg); }
    .ex-card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 14px 12px; margin:13px 0; box-shadow:0 1px 3px rgba(0,0,0,.04); }
    .ex-card.log-row { cursor:pointer; }
    .ex-card.log-row:active { background:#f1f3f6; }
    .ex-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .ex-card .ex-main { flex:1 1 auto; min-width:0; }
    .ex-card .ex-name { font-size:15px; line-height:1.3; }
    .ex-card .logged { display:block; margin-top:6px; padding-left:2px; font-size:12px; font-weight:600; color:var(--green); }
    .ex-card .log-hint { display:block; margin-top:6px; padding-left:2px; margin-bottom:6px; font-size:12px; font-weight:600; color:var(--blue); }
    .ex-card .ex-meta { flex:0 0 auto; display:flex; align-items:center; }
    .ex-card .tag { font-size:12px; color:var(--muted); white-space:nowrap; }
    .ex-card .req { margin-top:10px; padding-top:10px; padding-bottom:0; border-top:1px solid var(--line); }
    .nav { position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; display:flex; background:var(--card); border-top:1px solid var(--line); box-shadow:0 -1px 4px rgba(0,0,0,.05); padding-bottom:env(safe-area-inset-bottom); }
    .nav button { background:transparent; color:#3a3f47; border-radius:0; margin:0; padding:8px 0 10px; font-size:11px; flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
    .nav button svg { display:block; }
    .nav button.active { color:var(--green); }
    .req { display:flex; align-items:center; gap:10px; padding:8px 0; }
    .req .av { width:30px; height:30px; border-radius:50%; background:var(--green); color:#04130a; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:0 0 auto; }
    .req .rc { flex:1; font-size:12px; line-height:1.35; color:var(--fg); }
    .req .ra { display:flex; gap:6px; flex:0 0 auto; }
    .req .ra .sm { background:transparent; border:1px solid var(--line); color:var(--fg); font-weight:600; font-size:12px; padding:2px 10px; width:auto; margin:0; }
    .req .ra .sm.ok, .req .ra .sm.no { color:var(--fg); border-color:var(--line); background:#f4f5f7; }
    .center { text-align:center; padding-top:30px; }
    .avatar { width:44px; height:44px; border-radius:50%; background:var(--green); color:#04130a; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:17px; flex:0 0 auto; }
    .friend-row { display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); }
    .friend-row:last-child { border-bottom:none; }
    .friend-row .meta { flex:1 1 auto; min-width:0; }
    .friend-row .name { font-weight:600; font-size:15px; line-height:1.2; }
    .friend-row .handle { color:var(--muted); font-size:12px; }
    /* Invite friends list (New Workout) — compact iOS-style rows w/ checkmark */
    .inv-row { display:flex; align-items:center; gap:12px; padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
    .inv-row:last-child { border-bottom:none; }
    .inv-row .inv-meta { flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:12px; }
    .inv-av-wrap { flex:0 0 auto; }
    .inv-av { width:40px; height:40px; border-radius:50%; object-fit:cover; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; }
    .inv-text { min-width:0; }
    .inv-text .name { font-weight:600; font-size:15px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .inv-text .handle { color:var(--muted); font-size:12px; }
    .check { position:relative; flex:0 0 auto; width:24px; height:24px; }
    .check input { opacity:0; width:0; height:0; }
    .check .box { position:absolute; inset:0; border:2px solid var(--line); border-radius:50%; background:transparent; transition:.15s; display:flex; align-items:center; justify-content:center; }
    .check .tick { width:13px; height:13px; opacity:0; transform:scale(.5); transition:.15s; }
    .check input:checked + .box { background:var(--green); border-color:var(--green); }
    .check input:checked + .box .tick { opacity:1; transform:scale(1); }
    .streak-pill { display:inline-flex; align-items:center; gap:3px; background:#fff4ec; color:#e8590c; border-radius:999px; padding:3px 9px; font-size:12px; font-weight:600; margin-top:3px; }
    .streak-pill svg { width:13px; height:13px; }
    .add-row { display:flex; gap:8px; align-items:center; margin:0 0 4px; }
    .add-row input { flex:1; margin:0; }
    .add-row button { width:auto; margin:0; }
    .profile-head { display:flex; align-items:center; gap:16px; padding:6px 2px 14px; }
    .pavatar-wrap { position:relative; display:inline-block; cursor:pointer; }
    .pavatar { width:84px; height:84px; border-radius:50%; object-fit:cover; background:#e6e8ec; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:700; overflow:hidden; }
    .pcam { position:absolute; right:-2px; bottom:-2px; background:var(--green); color:#fff; border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:13px; border:2px solid #fff; }
    /* Avatar cropper modal (Hevy-style: top bar + centered circle) */
    .crop-overlay { position:fixed; inset:0; background:#000; z-index:100; display:flex; flex-direction:column; align-items:center; }
    .crop-topbar { width:100%; max-width:480px; display:flex; align-items:center; justify-content:space-between; padding:14px 16px; box-sizing:border-box; }
    .crop-x { width:auto; margin:0; padding:6px 10px; background:transparent; color:#fff; font-size:20px; line-height:1; }
    .crop-title { color:#fff; font-size:16px; font-weight:600; }
    .crop-done { width:auto; margin:0; padding:8px 18px; background:var(--green); color:#fff; font-size:15px; font-weight:600; border-radius:10px; }
    .crop-stage { position:relative; width:300px; height:300px; border-radius:50%; overflow:hidden; border:2px solid rgba(255,255,255,.9); touch-action:none; background:#222; margin-top:18px; }
    .crop-img { position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; user-select:none; -webkit-user-drag:none; }
    .crop-ring { position:absolute; inset:0; border-radius:50%; box-shadow:0 0 0 9999px rgba(0,0,0,.6); pointer-events:none; }
    .crop-hint { color:#fff; opacity:.7; font-size:13px; margin-top:22px; text-align:center; }
    .pinfo { flex:1; min-width:0; }
    .pname { font-size:20px; font-weight:700; }
    .pstats { display:flex; justify-content:space-around; text-align:center; padding:12px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .pstat { display:flex; flex-direction:column; }
    .pstat b { font-size:18px; }
    .pstat span { font-size:12px; color:var(--muted); }
    .pbio { padding:12px 2px; font-size:14px; line-height:1.4; }
    .feed-item { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
    .feed-item:last-child { border-bottom:none; }
    .fi-ic { flex:0 0 auto; width:22px; text-align:center; }
    .pick { display:flex; flex-direction:column; height:100%; padding:0 16px; padding-left:calc(16px + env(safe-area-inset-left)); padding-right:calc(16px + env(safe-area-inset-right)); }
    .pick-head { display:flex; align-items:center; gap:10px; padding:6px 0 8px; }
    .pick-head h1 { margin:0; flex:1; font-size:19px; }
    .pick-search { padding:2px 0 8px; }
    .pick-search input { margin:0; }
    .cat-pills { display:flex; gap:6px; overflow-x:auto; padding:4px 0 10px; -webkit-overflow-scrolling:touch; }
    .cat-pills::-webkit-scrollbar { display:none; }
    .cat-pill { flex:0 0 auto; background:var(--card); border:1px solid var(--line); color:var(--fg); border-radius:999px; padding:6px 13px; font-size:13px; cursor:pointer; }
    .cat-pill.on { background:var(--green); color:#fff; border-color:var(--green); }
    .pick-list { flex:1; overflow-y:auto; padding-bottom:20px; }
    .ex-row { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); cursor:pointer; }
    .ex-row:last-child { border-bottom:none; }
    .ex-row:active { background:#f1f3f6; }
    .ex-name { flex:1; min-width:0; font-size:15px; font-weight:600; }
    .ex-mg { font-size:12px; color:var(--muted); margin-top:2px; }
    .ex-add { flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:#eef1f5; color:var(--green); display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700; }
    .ex-row.ex-on .ex-add { background:var(--green); color:#fff; }
    .eq-pills { padding-top:0; border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:4px; }
    .ex-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
    .ex-badges { display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex:0 0 auto; max-width:42%; justify-content:flex-end; }
    .ex-badge { display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:600; letter-spacing:.4px; text-transform:capitalize; color:var(--muted); white-space:nowrap; }
    .ex-badge .dot { width:6px; height:6px; border-radius:50%; flex:0 0 auto; }
    .ex-badge.ex-type { text-transform:uppercase; letter-spacing:.7px; font-size:9.5px; color:#9aa3b2; }
    .ex-badge.lv-beginner { color:#1f8a4c; } .ex-badge.lv-beginner .dot { background:#1f8a4c; }
    .ex-badge.lv-intermediate { color:#9a6700; } .ex-badge.lv-intermediate .dot { background:#9a6700; }
    .ex-badge.lv-advanced { color:#b42318; } .ex-badge.lv-advanced .dot { background:#b42318; }
    .mg-card { display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); cursor:pointer; background:transparent; }
    .mg-card:active { background:#f1f3f6; }
    .mg-card .mg-ico { width:54px; height:54px; background:#f7f8fa; border-radius:12px; padding:0; flex:0 0 auto; color:var(--green); overflow:hidden; }
    .mg-card .mg-ico .mg-img { width:100%; height:100%; object-fit:contain; display:block; }
    .mg-card-body { flex:1; min-width:0; }
    .mg-card-name { font-size:16px; font-weight:600; text-transform:capitalize; letter-spacing:.2px; }
    .lib-cat { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:#8a94a6; margin:22px 2px 6px; }
    .lib-cat:first-of-type { margin-top:10px; }
    .mg-card-count { font-size:12px; color:var(--muted); margin-top:2px; }
    .mg-chev { flex:0 0 auto; color:var(--muted); font-size:20px; line-height:1; margin-left:8px; }
    .sheet-back { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:flex-end; opacity:0; transition:opacity .2s; z-index:50; }
    .sheet-back.show { opacity:1; }
    .sheet { width:100%; max-width:480px; margin:0 auto; background:var(--card); border-radius:16px 16px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .2s; }
    .sheet-back.show .sheet { transform:translateY(0); }
    .sheet-head { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
    .sheet-head h2 { margin:0; flex:1; font-size:18px; }
    .sheet-mg { font-size:13px; color:var(--muted); margin-bottom:12px; }
    .sheet-row { display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line); font-size:15px; }
    .sheet-row span { color:var(--muted); }
    .icon-btn { flex:0 0 auto; width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--green); font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .txt-btn { flex:0 0 auto; background:transparent; color:var(--green); border:none; font-size:14px; font-weight:600; padding:6px 8px; border-radius:8px; width:auto; margin:0; cursor:pointer; }
    .txt-btn:active { background:rgba(45,212,120,.12); }
    .tpl-page { padding-top:8px; }
    .lib-head { padding-bottom:6px; }
    .sheet label.muted { display:block; margin:10px 0 4px; font-size:12px; }
    .sheet select, .sheet input { width:100%; margin:0; }
