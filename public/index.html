<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" id="themeColorMeta" content="#131417" />
  <script>
    /* v230: stamp the theme BEFORE first paint so there is no light flash. Dark is the default;
       Settings > Appearance flips it (toggleTheme in app.js). try/catch: private mode can throw. */
    (function(){ var t='dark'; try{ t = localStorage.getItem('crewfit_theme') || 'dark'; }catch(e){}
      if(t==='dark') document.documentElement.classList.add('theme-dark');
      var m = document.getElementById('themeColorMeta') || document.querySelector('meta[name=theme-color]');
      if(m) m.content = t==='dark' ? '#131417' : '#f7f8fa'; })();
  </script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <!-- without this every first load asks for /favicon.ico and takes a 404 -->
  <link rel="icon" href="/icon-192.png" />
  <title>CrewFit</title>
  <style>
    /* --avatar is deliberately separate from --green: --green is a heavily-shared token (the
       default button background, checkboxes, "logged" checkmarks, exercise-add buttons, muscle
       icons) with many consumers that were never part of "how avatars look." Repointing --green
       itself to the new graphite would have turned all of those graphite too. --avatar exists so
       the "no photo yet" placeholder can change color on its own, matching this repo's own ink
       color rather than any accent -- see avatarColor() in app.js for why. */
    :root { color-scheme: light; --shine:rgba(6,122,6,.14); --bg:#fbfbfd; --card:#ffffff; --fg:#15181f; --muted:#6b7280; --green:#16a34a; --avatar:#2b2f38; --blue:#2563eb; --red:#dc2626; --line:#edeff2; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    /* Jeff, Sep 2: tried overscroll-behavior-y:none here for the harsh scroll bounce (killed it
       entirely) -- his follow-up: that reads as "awkward," it just stops dead now; he wants the
       bounce toned down, not gone. Reverted. CSS's overscroll-behavior has no "a little less"
       setting on the root scroller -- it's the browser's full native rubber-band (auto, back to
       how it was originally) or none at all (what he just said feels wrong); `contain` (the
       setting the app already uses on .sheet, see below) doesn't sit between those two for a ROOT
       scroller specifically -- there's nothing above body for it to "contain" against, so on body
       it renders identically to auto, not as a softer bounce. An actual middle ground -- some
       bounce, capped shorter than native -- would mean hand-rolling the rubber-band in JS
       (intercepting touch and capping the overscroll translateY ourselves), which is real
       feel-tuning work that needs his hands on the phone to dial in, not a one-line style fix. */
    html,body { margin:0; padding:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { max-width:480px; margin:0 auto; padding-bottom:calc(72px + env(safe-area-inset-bottom)); }
    /* Jeff, Sep 2: "scroll to the bottom of some pages and it leaves a good amount of empty
       space." Root cause (v137, Aug 15): this rule's own padding-bottom was added on top of
       `body`'s pre-existing calc(72px + safe-area) nav clearance above -- and since .wrap sits
       in body's normal document flow (the page itself scrolls, .wrap is not its own scroll
       container), the two stacked: 72+84=156px of dead air below the real content on every
       .wrap page, before the true end of scroll. body's 72px is the one other fixed chrome in
       this file is calibrated against (#updateBar's own `bottom` is literally `calc(72px + ...)`
       -- see below), so it's the correct, current value; a plain .wrap page (the document itself
       scrolls, nothing measures .wrap's own box height) doesn't need its own. Two call sites DO
       still need their own explicit bottom clearance and keep it, deliberately, for reasons
       specific to them, NOT as a copy of this bug: .rc-wrap (the recap screen) has its own
       matching padding-bottom because its min-height:100vh box is what a margin-top:auto CTA
       measures against (see .rc-wrap's own comment); .edit-mode has its own because it clears a
       DIFFERENT fixed bar (.sticky-bar, not .nav, and taller) on the one screen that shows it. */
    .wrap { padding:14px; padding-left:calc(14px + env(safe-area-inset-left)); padding-right:calc(14px + env(safe-area-inset-right)); }
    .create-flow > h1 { margin:0 0 16px; }                  /* New workout title -> gap below */
    /* v305 (Jeff: "clean up the visual and layout of the new workout screen"): Cancel used to sit
       alone, unpaired, at the very top -- the only screen in the app with a lone top-left button and
       no matching right-side action -- and the one action that actually finishes this screen (Create
       workout / Save changes) sat in a plain full-width button at the very bottom, unreachable
       without scrolling past however many exercises and invitees had been added by then. Same
       complaint Jeff raised about the workout-log editor on Sep 1 ("add a save button on the top
       right... scrolling to the bottom is annoying") -- and that fix's own principle applies again
       here even harder, since this form can run just as long: position:sticky, not a plain header
       row (a plain row would itself scroll out of view the moment the page scrolls, same as
       Routines' own pp-head -- fine for that screen since it's short, wrong for this one). Left
       UNTINTED (.edit-banner's light-blue wash marks "you're in a special edit state, different from
       normal viewing" -- this is a normal, default screen, not a mode, so it gets a plain sticky bar
       instead) and the bottom Create workout/Save changes button stays too, exactly like the
       workout-log editor's own top Save + bottom sticky-bar Save pair -- "a second way to reach Save,
       not a replacement for the first" (see renderWorkoutEdit's own comment in app.js). */
    .create-head { position:sticky; top:0; z-index:30; background:var(--bg); display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0 8px; margin:0 0 8px; }
    .tpl-name-edit { width:100%; margin:0 0 16px; font-size:19px; font-weight:700; line-height:1.2; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--text); box-sizing:border-box; }
    .tpl-name-edit:focus { outline:none; border-color:var(--green); }
    .create-flow > label.muted:first-of-type { margin-top:0; }
    h1 { font-size:19px; margin:4px 0 2px; }
    .sess-date { margin:18px 0 4px; }
    .sess-meta { margin:0 0 12px; }
    /* someone else is already training — a fact, not an action, so weight rather than colour
       (green is the avatar accent, blue is CTAs and the active nav tab) */
    .sess-started { margin:9px 2px 2px; font-size:12.5px; font-weight:700; color:var(--fg); }
    /* The host's note. No quote marks and no "— Brian Keith": on this screen you already know
       whose workout it is from the title, Who's in, and the chat, and the card around one short
       sentence was a box doing nothing. Italic is what marks it as something someone said. */
    .sess-note { margin:10px 2px 14px; font-size:13.5px; line-height:1.45; font-style:italic; color:var(--fg); }
    /* The two answers to an invitation. Weighted, in the flow, nothing pinned: this page is barely
       longer than one screen and is seen once, so a fixed bar would cost 68px of permanent chrome
       on top of the 60px nav and crowd the reply box. */
    .btn-answer { width:100%; margin:8px 0 0; padding:14px; border-radius:13px; border:1px solid transparent;
                  background:var(--blue); color:#fff; font-weight:700; font-size:15px; }
    .btn-answer.quiet { background:var(--card); border-color:var(--line); color:var(--muted); font-weight:600; }
    .answer-aside { display:flex; align-items:center; justify-content:center; gap:8px; margin:14px 0 4px; }
    .answer-aside .linkbtn { font-size:13px; }
    .aside-dot { color:#c9cfd8; font-size:13px; }
    .sess-actions { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0 4px; }
    .sess-actions .sm { width:auto; background:transparent; border:1px solid #b0b6c0; color:var(--fg); font-weight:600; }
    /* Jeff, Aug 28: now that Edit/Delete moved into the "..." menu, Log & Finish is the only pill
       left here most of the time -- a light tint read as one option among equals, which was the
       point when it had to share the row with two other pills, but it undersells the one thing
       you actually do on this screen every time. Solid, same as the app's other primary CTAs
       (.btn-primary, button.blue elsewhere), so it reads as THE action, not a suggestion. When
       it's paired with Leave workout (invited, non-creator), this also sharpens that hierarchy
       instead of flattening it -- solid primary vs. outlined secondary, not two same-weight pills. */
    .sess-actions .sm.blue { background:var(--blue); color:#fff; border-color:var(--blue); }
    .sess-actions .sm.sec { border-color:#b0b6c0; color:var(--fg); background:transparent; }
    .home-head { padding-top:calc(22px + env(safe-area-inset-top)); }
    .home-top { display:flex; align-items:center; justify-content:space-between; margin:0 0 16px; }
    .home-brand { font-size:20px; font-weight:700; letter-spacing:.2px; }
    .home-avatar { width:44px; height:44px; border-radius:50%; background:var(--avatar); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; cursor:pointer; object-fit:cover; overflow:hidden; box-shadow:0 2px 8px rgba(20,24,31,.18); }
    /* Sep 4: the bell sits in its own small row with the avatar, right-aligned as a pair --
       .home-top stays a simple 2-child flex (greeting block, this wrapper) rather than growing a
       3rd top-level child of its own. */
    .home-right { display:flex; align-items:center; gap:6px; flex:0 0 auto; }
    .home-bell { position:relative; width:40px; height:40px; border-radius:50%; border:none; background:transparent; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; flex:0 0 auto; }
    .home-bell:active { background:rgba(0,0,0,.06); }
    /* Corner count badge on the bell -- same var(--blue) "pending count" meaning as the existing
       .h1-row .badge on the Friends tab (not a new color), just a smaller corner-anchored shape
       since this sits ON an icon rather than beside a heading. Parent buttons (.home-bell,
       .profile-set) are already a positioning context (relative/absolute respectively), so this
       needs no positioned wrapper of its own. */
    /* Sep 4 (Jeff: "the number ... does not look properly centered"): flex-centering a
       line-box isn't the same as centering the glyph ink -- measured with a Range on the text
       node (see the notif-dot centering check in test/_render_notifications.mjs), the digit sat
       ~0.5px high in the 15px circle. padding-top:0.5px nudges it down to dead center (verified
       0 top/bottom delta on both "3" and "9+"); do not remove without re-measuring.
       Sep 4 (Jeff: "I don't like that black outline on the notifications widget") -- dropped the
       cutout ring (was box-shadow:0 0 0 2px var(--card), meant to separate the badge from the
       icon behind it the way iOS badges do). It assumed a flat --card backdrop; sitting on the
       Home gradient instead, the ring read as a mismatched dark outline. The blue fill against
       the bell already reads as its own shape without it. */
    .notif-dot { position:absolute; top:0; right:0; min-width:15px; height:15px; padding:0.5px 3px 0; border-radius:999px; background:var(--blue); color:#fff; font-size:9.5px; font-weight:700; line-height:1; display:flex; align-items:center; justify-content:center; box-sizing:border-box; }
    .home-greet { font-size:21px; color:var(--fg); font-weight:700; letter-spacing:-0.01em; }
    .home-sub { font-size:13px; color:var(--muted); margin-top:3px; }
    /* v221: adaptive stat row — open on the page, no card box (Jeff: "no windows"). Numbers only
       appear when true; the row itself is omitted with nothing to say. */
    .home-stats { display:flex; margin:2px 0 18px; }
    .hstat { flex:1; min-width:0; }
    .hstat + .hstat { border-left:1px solid var(--line); padding-left:14px; margin-left:14px; }
    .hstat .num { font-size:21px; font-weight:700; letter-spacing:-0.01em; font-variant-numeric:tabular-nums; }
    .hstat .lbl { font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.25; }  /* wraps — a truncated label is a hidden claim */
    /* v222 (Jeff: "when a workout schedules or a friend has activity, THEN it creates the pill
       box"): on Home, a card exists only when there is something real inside it. Cards float on
       shadow alone — no border fence — and an empty section is OPEN on the page: icon + line,
       no container. Discoverability rule intact: the section header and explanation still render,
       nothing is hidden, there is just no box drawn around nothing. */
    /* Between-section gap must clearly beat the gaps inside a section — with no box to draw the
       boundary, whitespace is the only thing separating groups (Jeff: "does it look clumped?"). */
    .home-empty { text-align:center; padding:14px 16px 4px; margin:2px 0 34px; }
    .home-empty svg { opacity:.5; margin-bottom:8px; }
    .home-empty .he-title { font-weight:600; font-size:13.5px; color:var(--fg); margin:0 0 3px; }
    .home-empty .he-sub { font-size:12.5px; color:var(--muted); margin:0; }
    /* Not scoped to .home-empty (unlike he-title/he-sub) -- the crews section header row reuses
       this exact "small blue CTA link" look for its "+ New crew" action even though a crew
       already exists there and it isn't inside a .home-empty block (Jeff, Sep 5: caught it
       rendering as plain white text -- the .home-empty-scoped rule below simply never matched). */
    .he-cta { display:inline-block; margin-top:8px; font-size:13px; font-weight:600; color:var(--blue); cursor:pointer; }
    /* he-cta's margin-top:8px is for stacking below the he-sub line in an empty state -- inside
       the crews header's flex row (.h1-row) it would just nudge the text a few px off-center
       against the h2 next to it. */
    .h1-row .he-cta { margin-top:0; }
    /* v221: the "window" — a sky wash at the very top of Home only, fading to the page
       background by ~380px down. Painted on .home-head itself (the wrap spans the whole app
       column, and body is already a 480px column), so it needs no body class, no JS toggling,
       and dies with the page. Not a header gradient rule violation: the header bar itself stays
       flat; this is atmosphere behind the whole top zone of one screen.
       Sep 4 (Jeff: "more slightly more visible blue gradient" then, after seeing it, "that's too
       much"): a half-step up from the original, not the fuller --s1 wash tried first -- eases
       from a touch bluer than the original top tone straight into the plain page background
       (solid final stop instead of fading-through-transparent, so it never washes out to a grey
       no-man's-land in between). */
    .home-head { background-image:linear-gradient(180deg, #e0eafb 0%, #eef4fd 45%, #fbfbfd 100%); background-repeat:no-repeat; background-size:100% 380px; }
    .act-chip { flex:0 0 auto; font-size:11px; font-weight:700; border-radius:999px; padding:3px 8px; vertical-align:middle; }
    /* was .act-chip.pr — the element also matched the unrelated .pr list-row class used by the
       Progress tab's PR list (line ~564: display:flex, padding:11px 2px, border-bottom). .act-chip
       (0,1,0) and .pr (0,1,0) are equal specificity, and .pr comes later in the file, so its
       display:flex/padding won outright — .act-chip.pr (0,2,0) itself never set either property,
       so there was nothing to out-specificity it with. Result: a full-width 390x35 row instead of
       a small pill (act-chip.done, with no such collision, stayed a normal ~25x18 pill next to it).
       Renamed instead of touching the .pr family, which several other Progress-tab classes
       (.pr-n/.pr-d/.pr-beat/etc.) depend on. Same fix applied to .type-tag.pr below, which had the
       identical collision on the logged-set PR badge. */
    /* PR markers are solid GREEN - green is the achievement color (streak, recap card);
       gold stays reserved for the Live now status. Dark uses the deeper fill green (v228
       contrast lesson: white on the bright dark-green fails). */
    .act-chip.act-pr { background:var(--green); color:#fff; }
    .act-chip.done { background:rgba(16,185,129,.15); color:var(--green); }
    .btn-new { padding:13px 18px; font-size:14px; border-radius:14px; margin:16px 0 8px; width:auto; align-self:flex-start; box-shadow:0 4px 12px rgba(37,99,235,.25); }
    h2 { font-size:12px; margin:28px 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; font-weight:600; }
    h2.light { margin:24px 0 8px; }
    h2.pt { margin-top:84px; }
    h2.sep { margin-top:28px; padding-top:18px; border-top:1px solid var(--line); }
    .inv-banner { background:#f4f8ff; border:1px solid #dbe7fb; border-radius:14px; padding:10px 12px; margin:0 0 16px; }
    /* v222: an empty state gets no box (the box appears when an invite does) */
    .inv-empty { font-size:12.5px; color:var(--muted); padding:0 2px; margin:0 0 16px; }
    /* A pending invite on the home screen. Deliberately NOT called .inv-row: that name belongs to
       the friend picker in New Workout further down this file, and while these two shared it the
       picker's padding, gap and border-bottom silently applied here — two invites drew a double
       divider, and the picker's cursor:pointer was the only reason this looked tappable. */
    /* padding is on the row, not on the sibling, so BOTH rows press with the same shaped highlight;
       the negative margin lets that highlight and the divider run the full width of the banner */
    .inv-card { display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; border-radius:10px; padding:8px 6px; margin:0 -6px; }
    .inv-card:active { background:#e8f1ff; }
    /* pressing Accept or Decline must NOT flash "opening the workout" at you — :active matches
       ancestors, so the row lights up for a button press unless this cancels it */
    .inv-card:has(.inv-actions:active) { background:transparent; }
    .inv-card + .inv-card { border-top:1px solid #e6eefb; }
    .inv-info { font-size:13px; color:var(--fg); line-height:1.35; }
    .inv-info .tag { margin-top:2px; }
    /* the row opens the workout — say so, since a phone has no cursor to hint with */
    .inv-open { font-size:11.5px; font-weight:600; color:var(--blue); margin-top:4px; }
    /* .row also sets a gap and is declared later, so this has to be .row.inv-actions to win */
    .row.inv-actions { justify-content:flex-end; gap:6px; flex:0 0 auto; }
    /* the two buttons are a pair, so they must be one size: .gray carries a real 1px border and
       .blue does not, which made them 2px different in both dimensions and 1px off each other */
    .inv-actions button.sm { border:1px solid transparent; }
    .inv-actions button.sm:active { filter:brightness(.93); }
    .feed-strip { display:flex; flex-direction:column; gap:2px; }
    /* .feed-lead: fixed-width lead column for every feed row (Jeff, Aug 28 2026). Photo thumbs
       (36px), check pills (~25px) and PR pills (~30px) are different widths, so names started at
       a different x per row type and mixed feeds looked ragged. The column is exactly the thumb's
       width; smaller pills center inside it. Both selectors are doubled (.feed-item.feed-lead
       would be wrong - lead is a CHILD) to outrank the later plain .feed-item rule's align-items. */
    .feed-item .feed-lead { flex:0 0 36px; display:flex; justify-content:center; align-items:center; }
    .feed-item.feed-recap { align-items:center; }
    .feed-thumb { width:36px; height:36px; border-radius:9px; object-fit:cover; flex:0 0 auto; background:var(--line); }
    .feed-item { font-size:13px; color:var(--fg); line-height:1.5; padding:7px 0; border-bottom:1px solid var(--line); }
    .feed-item:last-child { border-bottom:none; }
    .muted { color:var(--muted); font-size:12px; }
    .sm-text { font-size:11px; }
    .swap-note { font-size:11px; color:var(--muted); font-weight:400; }
    button { font:inherit; border:none; border-radius:12px; padding:11px; background:var(--green); color:#fff; font-weight:600; width:100%; margin:6px 0; cursor:pointer; font-size:14px; }
    button.sec { background:var(--card); color:var(--fg); border:1px solid var(--line); }
    button.blue { background:var(--blue); color:#fff; }
    button.red { background:var(--red); color:#fff; }
    button.sm { padding:7px 12px; width:auto; font-size:12px; border-radius:9px; margin:0; }
    button.sm.gray { background:var(--card); color:var(--fg); border:1px solid var(--line); }
    /* v306: was a centered pair of small pills — the only centered element on the New Workout
       screen (every other row is left-aligned or full-width). Made full-width + equal-split so
       it reads as a deliberate secondary action row under "+ Add exercise", not a decoration.
       v307 (Jeff, Sep 3): those pills were still sized off button.sm (12px text, 7px padding) --
       visibly smaller/thinner than "+ Add exercise" directly above, the button they're a matched
       pair of secondary actions with. Buttons here dropped the "sm" class entirely (full 14px/11px
       button sizing, same as "+ Add exercise"); this rule only needs to add the flex-split. */
    .tpl-actions { display:flex; gap:10px; margin-top:10px; }
    .tpl-actions button { flex:1; width:auto; margin:0; }
    .linkbtn { background:transparent; color:var(--blue); font-weight:600; width:auto; padding:5px; margin:0; font-size:13px; }
    input,select { width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); margin:5px 0; font:inherit; font-size:14px; }
    textarea { width:100%; box-sizing:border-box; padding:9px 11px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; font-size:13px; resize:none; min-height:60px; }
    .btn-primary { width:100%; box-sizing:border-box; margin-top:18px; padding:14px; border-radius:12px; border:none; background:var(--blue); color:#fff; font:inherit; font-size:15px; font-weight:700; cursor:pointer; }
    /* v225: cards float on shadow alone, app-wide — the border fence came down on Home in v222
       and every other tab now matches (border = wall, shadow = light). */
    .sheet .card { border:1px solid var(--line); box-shadow:none; }  /* white-on-white: hairline, not shadow */
    .card { background:var(--card); border:none; border-radius:18px; padding:8px 14px; margin:12px 0; box-shadow:0 1px 2px rgba(20,24,31,.04), 0 8px 20px -10px rgba(20,24,31,.14); }
    .notes-box { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 11px; margin:10px 0; font-family:inherit; font-size:13px; line-height:1.45; color:var(--fg); min-height:60px; box-sizing:border-box; }
    /* Posted-workout (read-only post) view */
    .pp-head { display:flex; align-items:center; justify-content:space-between; gap:10px; position:relative; }
    .pp-dots { background:transparent; border:none; font-size:22px; line-height:1; color:var(--fg); cursor:pointer; padding:2px 8px; border-radius:8px; width:auto; flex:0 0 auto; margin-left:auto; }
    .pp-dots:active { background:#f1f3f6; }
    .pp-menu { position:absolute; top:40px; right:0; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.12); z-index:20; min-width:170px; overflow:hidden; }
    .pp-menu button { display:block; width:100%; text-align:left; background:transparent; border:none; padding:12px 15px; font-size:14px; color:var(--fg); cursor:pointer; }
    .pp-menu button:active { background:#f1f3f6; }
    .pp-menu button.danger { color:#d23; }
    .pp-photos { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; border-radius:12px; scrollbar-width:none; }
    .pp-photos::-webkit-scrollbar { display:none; }
    .pp-photos img, .pp-photos video { flex:0 0 100%; width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px; display:block; background:#e6e8ec; scroll-snap-align:start; }
    .pp-photo { position:relative; flex:0 0 100%; }
    .pp-photo-x { position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; border:none; font-size:15px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:5; }
    .pp-photo-dots { display:flex; gap:6px; justify-content:center; margin-top:8px; }
    .pp-photo-dots .pp-dot { width:6px; height:6px; border-radius:50%; background:#cfd4da; transition:background .15s; }
    .pp-photo-dots .pp-dot.on { background:var(--blue); }

    /* Task #157: one-tap reaction on a posted recap -- deliberately one reaction, not a picker.
       Jeff, Sep 1: wanted the Instagram treatment -- a plain icon with no button chrome (no
       circle/pill background, just the glyph, like a like/comment/share row). First pass colored
       the "on" state var(--green) (reused, not a new color) -- but green in this app means an
       EARNED thing (PR pills, streak dot, celebration), and Jeff's next note called it out
       directly: "I don't like the green color of the heart - it doesn't fit and seems chunky."
       Reacting to someone else's post isn't an achievement of your own, so it moved to var(--blue)
       instead -- this app's color for actions/CTAs, which a tap-to-react actually is. Still just a
       text/icon color, not a background fill, so (per the dark-mode rule in CLAUDE.md: the bright
       dark accents are for text/borders, never backgrounds) this needs no separate dark override
       either. The "chunky" half of that same note was the filled heart drawing a stroke on top of
       its own fill -- see the fill/stroke-width logic on the svg itself in app.js, now stroke-free
       once filled. */
    /* Reaction "Liked by" row -- Jeff, Sep 1: the tap target and the who-reacted summary live
       together as ONE row at the top of the Comments card, right above the comment thread, not in
       their own separate section (his own screenshot of Instagram's layout is the reference). */
    /* Jeff, Sep 2: too much air around the heart, and the divider below it landed right on top of
       "No comments yet" with no room to breathe. Tightened the row's own padding across three
       rounds (6px/12px -> 4px/8px -> 2px/4px -> now 0/2px, each pass per Jeff's follow-up asking
       for still less) and gave the comment-list side of the divider its own top padding instead of
       relying on the row to supply it (see .pp-liked-row + .scrolllist below) -- symmetric spacing

    .pp-liked-row { display:flex; align-items:center; gap:8px; padding:0 4px 2px 0; border-bottom:1px solid var(--line); }

    .pp-react-btn svg { width:22px; height:22px; }

    .row { display:flex; gap:8px; align-items:center; }

    .cmt-body { flex:1 1 auto; min-width:0; }
    .cmt-top { display:flex; align-items:center; gap:8px; }

    /* Per-comment reaction (Task #157 follow-up) -- deliberately tiny/quiet: a bare heart outline
       and a plain number underneath, tucked to the right of the row, same weight Instagram gives a
       comment-like vs. the bold reaction row under a post's own notes. "On" color matches the
       post-level heart -- var(--blue), not green (see the comment above .pp-react-btn.on). */
    .cmt-react-col { display:flex; flex-direction:column; align-items:center; gap:1px; flex:0 0 auto; padding-top:3px; }
    .cmt-react-btn { width:22px; height:22px; background:transparent; border:none; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }

    /* ---- Save workout page ---- */

    .tab-note { font-size:11px; color:var(--muted); margin-top:8px; }

    .fav span { font-size:13px; font-weight:600; color:var(--fg); }
    .ex-card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 14px 12px; margin:13px 0; box-shadow:0 1px 3px rgba(0,0,0,.04); }

    .ex-card .log-hint { display:block; margin-top:6px; padding-left:2px; margin-bottom:6px; font-size:12px; font-weight:600; color:var(--blue); }
    /* Jeff, Aug 31, round 2: the recommendation stays right where "Tap to log sets" always sat
       (a side-by-side badge "lost that clean look") -- it just isn't flat blue like every other
       hint on the list anymore. "Repeat X" stays a quiet neutral gray -- routine information, not
       a new max, so it should not compete for attention the same way.
       Round 3: the log sheet's own .log-rec.up green (#067a06) was the first pick for "Try X
       today" -- Jeff flagged it as not working in light mode either (too dark/flat against the
       white card). Switched to var(--green) instead, matching THIS card's own already-shipped
       .logged text ("✓ N sets logged") one line below it -- same green the eye already reads as
       "positive" on this exact component, just brighter/fresher than the log sheet's darker icon
       tone. Same contrast tradeoff as .logged already carries (~3.3:1, under the 4.5:1 AA floor

    .ex-card .tag { font-size:12px; color:var(--muted); white-space:nowrap; }

    /* iOS Safari repaints position:fixed elements lazily during momentum scrolling and while
       the address bar collapses, so the bar visibly drifts up the page mid-scroll and snaps
       back at rest. Promoting it to its own compositor layer makes it track the viewport
       every frame. translateZ(0) does NOT create a containing block for its own fixed
       positioning (only for fixed DESCENDANTS), so the bar stays pinned. */
    /* v238 update bar: sits just above the nav, app language, one tap to refresh */
    #updateBar { position:fixed; left:12px; right:12px; bottom:calc(72px + env(safe-area-inset-bottom) + 10px); max-width:456px; margin:0 auto; z-index:45; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:14px; padding:11px 14px; font-size:13.5px; font-weight:600; display:flex; align-items:center; justify-content:space-between; gap:10px; box-shadow:0 8px 24px rgba(0,0,0,.18); }
    #updateBar button { width:auto; margin:0; padding:8px 14px; font-size:13px; background:var(--blue); color:#fff; border-radius:10px; }
    /* v240 undo toast: same slot as #updateBar, one z above (brief overlap acceptable), gone in
       ~6s. Undo is a text button, not a filled one — the toast is an offer, not a call to action. */
    #undoToast { position:fixed; left:12px; right:12px; bottom:calc(72px + env(safe-area-inset-bottom) + 10px); max-width:456px; margin:0 auto; z-index:46; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:14px; padding:11px 14px; font-size:13.5px; font-weight:600; display:flex; align-items:center; justify-content:space-between; gap:10px; box-shadow:0 8px 24px rgba(0,0,0,.18); opacity:0; transform:translateY(6px); transition:opacity .25s, transform .25s; }
    #undoToast.show { opacity:1; transform:none; }

    #undoToast button { width:auto; margin:0; padding:8px 12px; font-size:13.5px; font-weight:700; background:none; color:var(--blue); border:none; flex:0 0 auto; }
    @media (prefers-reduced-motion: reduce){ #undoToast { transform:none; transition:opacity .25s; } }
    .nav { position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; display:flex; background:var(--card); border-top:1px solid var(--line); box-shadow:0 -2px 10px rgba(0,0,0,.04); padding-bottom:env(safe-area-inset-bottom);
           transform:translateZ(0); -webkit-transform:translateZ(0); will-change:transform;

    .ex-mg { font-size:12px; color:var(--muted); margin-top:2px; }

    .ex-row.ex-on .ex-add { background:var(--green); color:#fff; }
    .eq-pills { padding-top:0; border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:4px; }
    .ex-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }

       favBtnHtml in app.js) keeps a tap here from also firing the row's own onclick underneath.
       Color comes from the SVG's own stroke/fill (var(--blue)/var(--muted), see favIcon in app.js),
       so it re-themes for free with no dark-mode override needed here. */
    .ex-fav-btn { flex:0 0 auto; width:30px; height:30px; margin:0; padding:0; border:none; background:transparent; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .ex-fav-btn:active { background:#eef1f5; }

    .ex-badge .dot { width:6px; height:6px; border-radius:50%; flex:0 0 auto; }
    .ex-badge.ex-type { text-transform:uppercase; letter-spacing:.7px; font-size:9.5px; color:#9aa3b2; }
    .ex-badge.lv-beginner { color:#1f8a4c; } .ex-badge.lv-beginner .dot { background:#1f8a4c; }
    .ex-badge.lv-intermediate { color:#9a6700; } .ex-badge.lv-intermediate .dot { background:#9a6700; }
    .ex-badge.lv-advanced { color:#b42318; } .ex-badge.lv-advanced .dot { background:#b42318; }
    .mg-card { display:flex; align-items:center; gap:16px; padding:15px 2px; border-bottom:1px solid var(--line); cursor:pointer; background:transparent; }
    .mg-card:active { background:#f1f3f6; }

    .mg-card .mg-ico .mg-img { width:100%; height:100%; object-fit:contain; display:block; }
    /* Jeff, Aug 26: the muscle-highlight red read as too bright/neon - muted it here rather than
       touching the source PNGs (13 files, hand-cropped), so it's one tunable knob instead of a
       re-export. Applies everywhere .mg-img is used (this grid + the exercise-detail sheet thumb
       below) since it's on the shared class, not a container-specific selector. */
    .mg-img { filter: saturate(60%) brightness(0.93); }
    .mg-card-body { flex:1; min-width:0; }
    .mg-card-name { font-size:16px; font-weight:600; text-transform:capitalize; letter-spacing:.2px; }
    .lib-cat { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin:28px 0 12px; }
    .lib-cat:first-of-type { margin-top:12px; }
    .card > .mg-card:last-child { border-bottom:none; }
    .mg-card-count { font-size:12px; color:var(--muted); margin-top:2px; }
    .mg-chev { flex:0 0 auto; color:var(--muted); font-size:20px; line-height:1; margin-left:8px; }
    /* v232: no scroll-through while a sheet is open. body.sheet-open is toggled by the
       sheet MutationObserver in app.js; overscroll-behavior stops the sheet's own scroll from
       chaining into the page when it hits its end. */
    html.sheet-open, html.sheet-open body { overflow:hidden; }  /* both: iOS scrolls html, desktop may scroll body */
    .sheet { overscroll-behavior:contain; }
    .sheet-back { overscroll-behavior:contain; position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:flex-end; opacity:0; transition:opacity .2s; z-index:70; }
    .sheet-back.show { opacity:1; }
    /* Jeff, Aug 28 (screenshot): "When I go to log a set the keyboard sometimes covers
       everything." max-height/overflow-y here (previously only on .log-sheet, so every OTHER
       sheet -- edit notes, edit a set, etc. -- had no cap at all and couldn't scroll) plus the
       visualViewport JS in app.js (search "Keyboard-aware bottom sheets") are the two halves of
       the actual fix: the JS keeps this shrunk to whatever's still visible above the keyboard. */
    .sheet { width:100%; max-width:480px; margin:0 auto; background:var(--card); border-radius:16px 16px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .2s; max-height:86vh; overflow-y:auto; box-sizing:border-box; }
    .sheet-back.show .sheet { transform:translateY(0); }
    .sheet-head { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
    .sheet-head h2 { margin:0; flex:1; font-size:18px; }
    .sheet-mg { font-size:13px; color:var(--muted); margin-bottom:12px; }
    .sheet-row { display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line); font-size:15px; }
    .sheet-row span { color:var(--muted); }

    .txt-btn { flex:0 0 auto; background:transparent; color:var(--blue); border:none; font-size:14px; font-weight:600; padding:6px 8px; border-radius:8px; width:auto; margin:0; cursor:pointer; }
    .txt-btn:active { background:rgba(37,99,235,.12); }
    /* Sep 4: "Edit set" sheet's Save/Delete redesign -- Delete used to be a second full-strength
       solid CTA (button.red) stacked right under Save, so both read as equally likely actions.
       Destructive actions elsewhere in the app are quiet red text, never a filled button (the
       ⋯ menu's danger row, .sheet-row.red for Log out) -- this brings Delete in line with that:
       one clear primary action, one quiet exit. The extra top margin (vs. Save's own 6px) is what
       actually separates the two, since neither has a border or fill to lean on.
       The sheet's own ✕ (editLogSet + its posted-workout twin editPostedSet -- "same sheet shape"
       per the comment above them) swapped the tiny .sec.sm pill for .icon-btn, the circular close
       target already used for the seed-row Remove ✕ -- a real tap target instead of a button sized
       to its own 12px label. */
    .danger-text { background:transparent; color:var(--red); border:none; font-size:14px; font-weight:600; width:100%; margin:14px 0 0; padding:10px; border-radius:10px; cursor:pointer; text-align:center; }
    .danger-text:active { opacity:.55; }

    .lib-head { padding-bottom:6px; }

    .seed-row-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
    .seed-row-fields { display:flex; gap:10px; margin:4px 0 2px; }

    /* v309 (Jeff, Sep 3): "click in on an exercise... background is still black... needs the
       white background" -- gave the whole thumbnail ROW a white plate so the muscle-diagram PNG
       (public/muscle-icons, transparent, light-gray body model) wasn't a washed-out figure
       floating in near-black space.
       Revised Sep 5: once the image itself shrank to a 54x54 icon (Jeff: "decrease the size of
       that image"), that same edge-to-edge white plate behind a small icon read as a stray white
       bar across the sheet -- Jeff flagged it on sight. The fix was already sitting one screen
       over: renderLibGroups()'s muscle-tile icons solve the identical "PNG needs a light
       backdrop" problem by putting the white background on the icon CHIP only (.mg-ico -- both
       here and there get bumped to solid white in dark theme via the shared
       :where(html.theme-dark) .mg-ico rule further down), never on the row around it.
       .sheet-thumb is back to a plain transparent flex row like every other row in the sheet, and
       the caption reverts to the normal themed --muted color now that it isn't sitting on white.
       Sized at 84px, not the library tile's 54px (.mg-card .mg-ico, a more specific selector that

    .sheet-thumb { display:flex; align-items:center; gap:12px; margin:6px 0 4px; }

    .sheet-thumb .mg-ico { width:84px; height:84px; border-radius:18px; }

    .stepper b { min-width:28px; text-align:center; font-size:17px; }
    /* Jeff, Sep 2, round 1: "certain things user won't know or find until they happen ... maybe
       a spot in settings that will walk the user through the app." Round 1 shipped as six
       abstract icon+text cards with a small redrawn preview snippet. Jeff, round 2: "I am not a
       fan of those cards. They don't do a good job showing ... I want to use an actual full
       visuals of pages ... where it highlights specific points ... not these all pop up pages
       with quick boxes that only show 1 to two things." Rebuilt around real screenshots
       (public/onboarding/*.png, see test/_gen_walkthrough_assets.mjs) with a spotlight ring —
       .wk-hl positioned by percentage (of the cropped screenshot's own box, computed alongside

       dimming trick: a huge spread on .wk-hl itself dims everything OUTSIDE its rounded box,
       clipped to .wk-shot-wrap's own overflow:hidden edge. One sheet, eight cards stepped with

    .draft-ex.dragging { position:fixed; z-index:999; background:var(--card); border:1px solid var(--brand); box-shadow:0 10px 28px rgba(0,0,0,.18); border-radius:14px; transform:scale(1.03); opacity:1; transition:none; }
    .drag-placeholder { border:2px dashed var(--brand); border-radius:14px; background:rgba(79,140,255,.07); }

    /* Today's not-yet-finished workout, pulled to the top of Home's "Your Sessions" so it's the

       idiom as .pr-beat, amber instead of green/blue since neither of those is free for this

    .session-live { background:rgba(245,158,11,.05); border-left:3px solid #f59e0b; padding-left:9px; margin-left:-3px; border-radius:0 10px 10px 0; }
    .live-badge { display:block; width:fit-content; font-size:11px; font-weight:700; letter-spacing:.02em; color:#b45309; background:rgba(245,158,11,.15); border-radius:999px; padding:3px 9px; margin-bottom:6px; }
    /* Neutral, not alarming — a missed session is a plain fact, not an error, and it is never
       hidden or blocked from late logging (CLAUDE.md: discoverability over minimalism). Same

    /* v224: the pill is back (Jeff liked the shape) with a bg dark enough to READ as a pill.

    .missed-badge { display:block; width:fit-content; font-size:11px; font-weight:700; letter-spacing:.02em; color:#565d68; background:#e4e7ec; border-radius:999px; padding:3px 9px; margin-bottom:6px; }

    .upcoming-badge { display:block; width:fit-content; font-size:11px; font-weight:700; letter-spacing:.02em; color:#565d68; background:#e4e7ec; border-radius:999px; padding:3px 9px; margin-bottom:6px; }

    /* v257: Jeff, Aug 30 - the v243 quick-log box (a whole separate blue-bordered input+button
       row above the real weight/reps/RIR row) was "taking over" the log-set sheet -- its border
       drew the eye and its position, first after the recommendation box, is exactly where a
       thumb reflexively lands, so he kept typing into it by mistake instead of the real fields
       just below. The smart parsing (parseQuickLog, still untouched) already only ever WROTE
       into the real weight/reps/RIR/type fields -- the box itself was never the source of truth,
       just a transcription surface -- so removing it costs nothing functionally: a small icon-
       only mic button (.ql-mic-icon below, sized to match the row's other inputs) sits right in
       the real add-row instead, exactly where Jeff asked for it ("by the spot we type in the
       info"). Recording state is the LIVE gold - gold means "happening right now" in this app -
       never red, same rule the old .ql-field.ql-rec state followed.
       touch-action:none keeps a press-and-hold from scrolling the sheet. */
    .ql-mic-icon { touch-action:none; width:41px; height:41px; }
    .ql-mic-icon.ql-rec { color:#b45309; border-color:#f59e0b; animation:qlPulse 1.1s ease-in-out infinite; }
    @keyframes qlPulse { 50% { opacity:.4; } }
    @media (prefers-reduced-motion: reduce){ .ql-mic-icon.ql-rec { animation:none; } }
    /* v312 (Jeff, Sep 4): "get rid of the logging page and have it all on the active workout
       page. no additional pop up page ... shows all the sets I've logged, and the ability to log
       all in that one page." Each exercise card on the active workout is now the logger the
       sheet used to be (exLogBlockHtml in app.js). The set rows reuse the posted-workout view's
       .pp-set language -- Jeff sent that screen as the target -- just a size up, since here they
       are the working surface rather than a recap. The hairline under the name is the card's
       own header rule, same as his screenshot. */
    .ex-log .ex-head { padding-bottom:9px; border-bottom:1px solid var(--line); }
    .ex-log .ex-sub { margin:4px 0 0; font-size:12.5px; }
    .ex-log .ex-log-sets { margin:6px 0 4px; }
    .ex-log .pp-set { font-size:14px; padding:6px 0; gap:10px; }
    .ex-log .pp-set-n { width:26px; height:26px; border-radius:7px; font-size:12px; }
    .ex-log .pp-set-edit { font-size:12px; }
    .ex-log .ex-log-empty { font-size:12.5px; padding:6px 0 4px; }
    .ex-log .log-rec { margin:4px 0 8px; }
    /* v313: the four set types are always on show, one row per card (Jeff: "have them all listed
       ... decrease the font size ... to fit cleaner"). Smaller type than the generic .seg chip
       so Normal / Warm up / Drop / Failure sit on one line with room to breathe at 390px. */
    .ex-log .type-seg { margin:8px 0 8px; gap:5px; }
    .ex-log .type-seg .chip { font-size:11px; padding:7px 0; letter-spacing:.1px; white-space:nowrap; }
    .ex-log .load-note { margin-top:8px; }
    .ex-log .rest { margin-top:10px; }
    .ex-log .pp-pr.pr-pop { animation:prPop .5s cubic-bezier(.34,1.56,.64,1) both; }
    .rest { display:inline-flex; align-items:center; gap:8px; margin-top:14px; padding:8px 12px; background:#eef1f5; border-radius:999px; font-size:12px; color:var(--muted); }
    .rest b { color:var(--fg); font-size:14px; font-weight:700; }
    .note { font-size:11px; color:var(--muted); margin-top:14px; }
    /* Load-type note under the weight box: says what the number means, and for a pair
       shows the doubled total live so the convention never has to be reasoned about. */
    /* v314 (Jeff, Sep 4): "the text hits the edges of the box and the box may be a bit big" --
       now that this sits inside every exercise card (v312) rather than alone in a sheet, it is a
       slim note, not a panel: 18px icon, 12.5px headline, the why-line tucked under it at the
       same indent (grid, not flex-wrap + padding-left guesswork), tighter padding with real room
       on the right so the text never touches the edge, and a border only where it says
       something (dashed green = one more session; the solid green tint = tap to use). */
    .log-rec { display:grid; grid-template-columns:18px 1fr; column-gap:9px; row-gap:1px; align-items:center;
      margin:0 0 12px; padding:8px 14px 8px 10px; border-radius:10px; font-size:12.5px; line-height:1.35; cursor:pointer; border:1px solid transparent; }
    .log-rec.up { background:rgba(6,122,6,.07); border-color:rgba(6,122,6,.22); }
    /* Three steps, and the fill is what says which: DASHED = not yet, SOLID = a verdict.
       .soon (dashed grey, no fill) nothing to advise yet · .almost (dashed green) one session
       away · .up (solid green) go, and it is the only one that is tappable. No brand blue in
       any of them — blue is the CTA colour and none of these are CTAs. */
    /* ---- workout recap (showRecap) — seen once after Log & Finish ---- */
    /* v237 (Jeff): no dead gap under Done on a short recap - the wrap is a min-full-height
       column and the CTA takes margin-top:auto, so the button settles at the bottom of the
       screen when content is short and simply follows the content when it is long. Not fixed
       chrome: it scrolls like everything else.
       Sep 2, 2026: .wrap itself no longer carries its own nav-clearance padding-bottom (that was
       doubling up with body's -- see the comment on .wrap above) so this rule now supplies its
       OWN, matching body's calc(72px + safe-area) exactly -- still needed here specifically
       because this box's min-height:100vh (border-box) is what margin-top:auto on .rc-cta
       measures against; without it a short recap's Done button would settle flush with the
       viewport's bottom edge, behind the nav, rather than just above it. */
    .rc-wrap { padding-top:calc(18px + env(safe-area-inset-top)); padding-bottom:calc(72px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; min-height:100vh; }
    .rc-wrap .rc-cta { margin-top:auto; padding-top:18px; }
    /* v235 celebration: the recap opens like a win. One-shot CSS entrance - a self-drawing
       check, then each block rises in order. All of it is decoration over content that is
       already visible-safe: prefers-reduced-motion shows the finished state instantly. */
    .rc-check { width:56px; height:56px; display:block; margin:6px auto 10px; }
    .rc-check circle { stroke:var(--green); stroke-width:2.5; fill:none; stroke-dasharray:164; stroke-dashoffset:164; animation:rcDraw .8s ease-out forwards; }
    .rc-check path { stroke:var(--green); stroke-width:3.2; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:34; stroke-dashoffset:34; animation:rcDraw .5s .65s ease-out forwards; }
    @keyframes rcDraw { to { stroke-dashoffset:0; } }
    @keyframes rcRise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
    .rc-h1 { font-size:22px; font-weight:700; margin:2px 0 2px; letter-spacing:-.2px; text-align:center; animation:rcRise .55s .25s ease-out both; }
    .rc-sub { text-align:center; font-size:13px; color:var(--muted); margin:0 0 14px; animation:rcRise .55s .38s ease-out both; }
    .rc-streakline { display:flex; align-items:center; justify-content:center; gap:5px; color:var(--green); font-size:13px; font-weight:600; margin:6px 0 2px; animation:rcRise .55s .5s ease-out both; }
    .rc-stats .rc-tile:nth-child(1) { animation:rcRise .55s .6s ease-out both; }
    .rc-stats .rc-tile:nth-child(2) { animation:rcRise .55s .75s ease-out both; }
    .rc-stats .rc-tile:nth-child(3) { animation:rcRise .55s .9s ease-out both; }
    .rc-pr { animation:rcRise .6s 1.05s ease-out both; position:relative; overflow:hidden; }
    .rc-pr::after { content:""; position:absolute; inset:0; transform:translateX(-110%); background:linear-gradient(115deg, transparent 30%, var(--shine) 50%, transparent 70%); animation:rcShine 1.4s 1.8s ease-out 1 both; pointer-events:none; }
    @keyframes rcShine { to { transform:translateX(110%); } }
    /* Reusing the recap page's celebration-card look OUTSIDE that page's staggered entrance
       sequence (e.g. the crew challenge banner) -- the base .rc-pr rule bakes in a 1.05s
       animation-delay tuned to appear after rc-h1/rc-sub/rc-streakline/rc-stats stagger in first.
       Reused bare, anyone opening the crew sheet stares at a blank box for over a second before
       it pops in -- caught in the challenge-complete verification screenshot, which rendered the
       card empty because it was captured mid-delay. This modifier zeroes both delays for
       standalone use so the card is visible immediately. */
    .rc-pr.rc-pr-now { animation-delay: 0s; }
    .rc-pr.rc-pr-now::after { animation-delay: .25s; }
    @keyframes prPop { 0% { transform:scale(.3); opacity:0; } 100% { transform:scale(1); opacity:1; } }
    .type-tag-pr.pr-pop { animation:prPop .5s cubic-bezier(.34,1.56,.64,1) both; }
    @media (prefers-reduced-motion: reduce) {
      .rc-check circle, .rc-check path { animation:none; stroke-dashoffset:0; }
      .rc-h1, .rc-sub, .rc-streakline, .rc-stats .rc-tile, .rc-pr, .type-tag-pr.pr-pop { animation:none; }
      .rc-pr::after { animation:none; display:none; }
    }
    .rc-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:0 0 14px; }

    /* inline-flex + nowrap + line-height:1 keeps the icon beside the label on ONE line,
       so both buttons share a baseline and match in size (they wrapped differently before). */
    .view-toggle button { display:inline-flex; align-items:center; justify-content:center; gap:5px; white-space:nowrap; min-width:68px; height:32px; padding:0 12px; line-height:1; border:1px solid var(--line); background:#fff; color:var(--muted); font-size:12px; font-weight:600; border-radius:9px; cursor:pointer; margin:0; width:auto; }
    .view-toggle button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
    .sec-head { display:flex; align-items:center; }
    /* ---- Progress tab ---- */
    .grp + .grp { margin-top:4px; padding-top:10px; border-top:1px solid var(--line); }
    .grp-h { font-size:10.5px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--muted); padding:2px 2px 4px; }
    .rp { display:flex; align-items:center; gap:11px; padding:12px 2px; border-bottom:1px solid var(--line); }
    .rp:last-child { border-bottom:none; }
    .rp-ic { flex:0 0 auto; width:27px; height:27px; border-radius:8px; background:rgba(6,122,6,.11); color:#067a06; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; }
    .rp-main { flex:1; min-width:0; }
    .rp-name { font-size:14.5px; font-weight:600; }
    .rp-why { font-size:11.5px; color:var(--muted); margin-top:2px; }
    .rp-to { flex:0 0 auto; text-align:right; }
    .rp-new { font-size:15px; font-weight:700; color:var(--fg); }
    .rp-tag { font-size:10px; font-weight:700; color:#067a06; text-transform:uppercase; letter-spacing:.4px; margin-top:2px; }
    .hold-sec { margin-top:4px; padding-top:10px; border-top:1px solid var(--line); }
    /* Jeff, Sep 2: a .hold-sec (Almost / Hold for now / the Plateau card's only section) is
       sometimes the very FIRST thing in its .card -- e.g. "Add weight next time" when there's
       nothing in the ready list, just an Almost one -- and this divider, meant to separate it
       from a "ready" section above it, then sat as a stray line right under the card's own
       rounded top edge, floating above the heading with nothing above the line to separate from.
       The card's own edge is the boundary in that case, not an internal rule. */
    .hold-sec:first-child { margin-top:0; padding-top:0; border-top:none; }
    .hold-head { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; padding:2px 2px 0; }
    .hold { display:flex; align-items:center; gap:11px; padding:11px 2px 2px; }
    .hold-ic { flex:0 0 auto; width:27px; height:27px; border-radius:8px; background:#eef1f5; color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; }
    /* "Almost" is a positive state and must not read as the negative one directly below it. */
    .hold-ic.almost-ic { background:rgba(6,122,6,.12); color:#067a06; }
    .rulenote { font-size:11.5px; color:var(--muted); line-height:1.55; padding:11px 2px 0; border-top:1px solid var(--line); margin-top:8px; }
    .rulenote b { color:var(--fg); font-weight:700; }
    /* Weekly volume meter rows (Progress page) — a track (var(--line)) with a fill that turns
       green only once the week's target is actually met, matching the app-wide rule that green
       means earned, not just "some progress." */
    .mv-row { padding:9px 2px; border-bottom:1px solid var(--line); }
    .mv-row:last-child { border-bottom:none; }
    .mv-top { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; }
    .mv-name { font-size:13.5px; font-weight:600; }
    .mv-n { font-size:12.5px; font-weight:700; color:var(--fg); }
    .mv-of { font-size:11px; font-weight:600; color:var(--muted); }
    .mv-track { height:7px; border-radius:999px; background:var(--line); overflow:hidden; }
    .mv-fill { height:100%; border-radius:999px; background:var(--blue); }
    .mv-fill.mv-met { background:var(--green); }
    .kpi { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; }
    .hero { font-size:30px; font-weight:700; line-height:1; letter-spacing:-.5px; }
    .hero-u { font-size:14px; color:var(--muted); font-weight:600; }
    .hero-cap { font-size:11.5px; color:var(--muted); margin-top:4px; }
    /* Consistency's streak leads the card the same way .hero does elsewhere on this page (still
       the biggest thing here), but Jeff, Sep 2: "don't bolden the number like that" -- a light
       weight and normal letter-spacing instead of .hero's bold/tight treatment reads calmer,
       closer to the page's own airy language, without touching .hero itself (Strength trend and
       others still want the bold version). */
    .streak-hero { font-size:34px; font-weight:400; line-height:1; letter-spacing:normal; }
    .streak { display:inline-flex; align-items:center; gap:4px; background:#eef1f5; color:var(--fg); border-radius:999px; padding:4px 10px; font-size:11.5px; font-weight:600; }
    .pr { display:flex; justify-content:space-between; align-items:center; padding:11px 2px; border-bottom:1px solid var(--line); }
    .pr:last-child { border-bottom:none; }
    .pr-n { font-size:14px; font-weight:600; }
    .pr-d { font-size:11px; color:var(--muted); margin-top:2px; }
    .pr-r { text-align:right; }
    .pr-w { font-size:14px; font-weight:700; }
    .pr-self { background:#fbfcfd; border-left:3px solid #dfe3e9; padding-left:9px; margin-left:-3px; border-radius:0 8px 8px 0; }
    .self-tag { font-size:9.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); background:#eef1f5; border-radius:5px; padding:2px 6px; margin-left:5px; vertical-align:1.5px; }
    .pr-goal { font-size:11px; color:var(--blue); font-weight:700; margin-top:2px; }
    .pr-beat { background:rgba(6,122,6,.045); border-left:3px solid #067a06; padding-left:9px; margin-left:-3px; border-radius:0 10px 10px 0; }
    .pr-beat-was { font-size:11.5px; color:var(--muted); margin-top:3px; }
    .pr-beat-was b { color:var(--fg); font-weight:700; }
    .beat-chip { display:inline-block; margin-top:4px; font-size:10px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; color:#fff; background:#067a06; border-radius:6px; padding:3px 7px; }
    .empty { text-align:center; padding:8px 6px 6px; }
    .empty-ic { width:42px; height:42px; margin:0 auto 10px; border-radius:12px; background:#eef1f5; color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:19px; }
    .empty-t { font-size:15px; font-weight:700; }
    .empty-b { font-size:12.5px; color:var(--muted); line-height:1.5; margin:6px auto 0; max-width:275px; }
    .empty-b b { color:var(--fg); }
    .chips { display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none; }
    .chips::-webkit-scrollbar { display:none; }
    .ch-head { display:flex; align-items:baseline; justify-content:space-between; }
    .ch-val { font-size:26px; font-weight:700; letter-spacing:-.4px; }
    .ch-unit { font-size:12px; color:var(--muted); font-weight:600; }
    .ch-note { font-size:11.5px; color:var(--muted); margin:3px 0 12px; }
    .tblnote { font-size:11px; color:var(--muted); padding:10px 2px 0; line-height:1.5; border-top:1px solid var(--line); margin-top:10px; }
    .drv-head { font-size:10.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin:14px 0 2px; padding-top:12px; border-top:1px solid var(--line); }
    .drv { display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line); }
    .drv:last-child { border-bottom:none; }
    .drv-n { flex:1; min-width:0; font-size:13.5px; font-weight:600; }
    .drv-w { font-size:11.5px; color:var(--muted); white-space:nowrap; }
    .drv-p { width:52px; text-align:right; font-size:13px; font-weight:700; }
    .drv-p.up { color:#067a06; } .drv-p.flat { color:var(--muted); }
    .eg-wrap { margin-top:16px; padding-top:12px; border-top:1px dashed var(--line); text-align:left; }
    .eg-cap { font-size:10px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
              color:var(--muted); text-align:center; margin-bottom:2px; }
    .eg-row { opacity:.45; border-bottom:none; }
    :root { --s1:#cde2fb; --s2:#9ec5f4; --s3:#5598e7; --s4:#2563eb; }
    /* compact segmented track, matching the save-page visibility control rather than the
       chunky pill row used for set types — a range switch shouldn't outweigh the chart */
    .seg.wk-seg { background:#eef1f5; border-radius:10px; padding:3px; gap:0; margin:14px 0 2px; }
    .seg.wk-seg button { flex:1; border:none; background:transparent; padding:8px 4px; border-radius:8px;
      font:inherit; font-size:12.5px; font-weight:600; color:var(--muted); margin:0; }
    .seg.wk-seg button.on { background:#fff; color:var(--blue); box-shadow:0 1px 2px rgba(0,0,0,.08); }
    /* Home: "+ New workout" (primary) paired with "Quick Workout" (secondary quick-start) */
    .home-actions { display:flex; gap:10px; align-items:center; margin:16px 0 8px; flex-wrap:wrap; }
    .home-actions .btn-new { margin:0; }
    /* padding is 1.5px shorter than .btn-new's on each side, on purpose: .btn-new has no border
       and .btn-quick has a 1.5px one, so equal padding would make .btn-quick 3px taller — this
       keeps both buttons the same height and baseline-aligned (see the .inv-actions comment above
       for the same bug in the Accept/Decline pair). */
    .btn-quick { width:auto; margin:0; padding:12px 16.5px; font-size:14px; border-radius:14px; background:#fff; color:var(--blue); border:1.5px solid var(--blue); display:inline-flex; align-items:center; gap:7px; font-weight:700; }
    .btn-quick svg { width:16px; height:16px; flex:0 0 auto; }
    .btn-quick:active { background:#eef4ff; }
    /* Workout detail: pending invitees, distinct from joined "Who's in" chips */
    .crew-invited-label { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin:12px 0 6px 2px; }
    .fav.pending { background:transparent; border:1px dashed #ccd2dc; }
    .fav.pending span { color:var(--muted); }
    .fav-av-wrap { position:relative; flex:0 0 auto; display:inline-flex; }
    .fav-av-wrap .fav-av { opacity:.55; }
    .fav-pending-dot { position:absolute; right:-3px; bottom:-3px; width:14px; height:14px; border-radius:50%; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; }
    .fav-pending-dot svg { width:8px; height:8px; color:#9aa1ad; display:block; }
    /* A "Quick Workout" session with nothing logged yet */
    .qs-empty { text-align:center; padding:34px 16px; color:var(--muted); }
    .qs-empty svg { width:34px; height:34px; color:#c7cedb; margin-bottom:10px; }
    .qs-empty .qs-t { font-size:14px; font-weight:600; color:var(--fg); margin-bottom:3px; }
    .qs-empty .qs-s { font-size:12.5px; }
    .qs-add { margin-top:16px; }

    /* ============================ DARK MODE (v228) ============================
       Follows the phone's setting - no in-app toggle. One media block, two parts:
       (1) the :root tokens flip, which re-colors everything var()-based;
       (2) targeted overrides for every rule that uses literal colors (inventory
       in the v228 commit). Palette is TUNED, not inverted: charcoal base (pure
       black kills card shadows), brightened blue (#5a8bff - brand #2563eb fails
       contrast on charcoal), muted gold for Live (amber went "Halloween" on
       dark, Jeff Aug 28), green stays the achievement color. Keep this block at
       the END of the stylesheet so equal-specificity overrides win by order. */
    /* ============================ DARK MODE (v228, re-scoped v230) ============================
       v230 (Jeff): the app no longer follows the phone - DARK IS THE DEFAULT, with a Light/Dark
       switch in Settings. Theming is class-based: a tiny inline script in <head> stamps
       html.theme-dark from localStorage('crewfit_theme', default 'dark') BEFORE first paint, and
       toggleTheme() in app.js flips it. Everything below is the v228 palette unchanged, scoped
       under html.theme-dark instead of prefers-color-scheme. Keep this at the END of the
       stylesheet so equal-specificity overrides win by order. */
    html.theme-dark {
        color-scheme: dark;
        --shine:rgba(62,207,114,.20);
        --bg:#131417; --card:#1c1e22; --fg:#f1f2f4; --muted:#a2a7b0;
        --green:#3ecf72; --avatar:#454a54; --blue:#5a8bff; --red:#f3766a; --line:#2b2e34;
        --s1:#2b3a5c; --s2:#3a5488; --s3:#4a71b8; --s4:#5a8bff;
      }
      /* -- surfaces & fills (light grays -> raised charcoal) -- */
      :where(html.theme-dark) .pp-dots:active, :where(html.theme-dark) .pp-menu button:active, :where(html.theme-dark) .lib-item:active, :where(html.theme-dark) .ex-card.log-row:active, :where(html.theme-dark) .lib-item.log-row:active, :where(html.theme-dark) .profile-set:active, :where(html.theme-dark) .mg-card:active, :where(html.theme-dark) .ex-row:active, :where(html.theme-dark) .ex-fav-btn:active, :where(html.theme-dark) .set-row:active, :where(html.theme-dark) .rc-chip, :where(html.theme-dark) .rest, :where(html.theme-dark) .load-chip, :where(html.theme-dark) .hold-ic, :where(html.theme-dark) .self-tag, :where(html.theme-dark) .empty-ic, :where(html.theme-dark) .streak, :where(html.theme-dark) .pill, :where(html.theme-dark) .chip, :where(html.theme-dark) .fav, :where(html.theme-dark) .ex-add, :where(html.theme-dark) .ex-idx, :where(html.theme-dark) .t-normal, :where(html.theme-dark) .pp-set-n, :where(html.theme-dark) .seg .chip, :where(html.theme-dark) .seg button, :where(html.theme-dark) #vis.seg, :where(html.theme-dark) .seg.wk-seg, :where(html.theme-dark) .log-rec.soon .lr-ic, :where(html.theme-dark) .log-rec.hold .lr-ic { background:#262930; }
      :where(html.theme-dark) .missed-badge, :where(html.theme-dark) .upcoming-badge { background:#2f3238; color:#a2a7b0; }
      :where(html.theme-dark) .log-rec.hold { background:#1f2126; }
      /* Muscle diagrams are drawn on/for white - on a dark tile the gray figure dissolves
         and only the red pops (Jeff, Aug 28). The tile stays white in dark mode, like app-store
         icon tiles; rounded corners already soften it. */
      :where(html.theme-dark) .mg-card .mg-ico, :where(html.theme-dark) .mg-ico { background:#fff; }
      :where(html.theme-dark) .mw-thumb, :where(html.theme-dark) .thumb, :where(html.theme-dark) .pavatar, :where(html.theme-dark) .pp-photos img, :where(html.theme-dark) .pp-photos video, :where(html.theme-dark) .saved-grid .sq, :where(html.theme-dark) .feed-cover, :where(html.theme-dark) .wthumb { background:#262930; }
      :where(html.theme-dark) .wthumb-empty { background:linear-gradient(135deg,#24262c,#1c1e22); }
      :where(html.theme-dark) .wexb li::before { background:#2b2e34; color:#a2a7b0; }
      :where(html.theme-dark) .add-media { background:#1f2126; border-color:#2b2e34; }
      :where(html.theme-dark) .add-row input { background:#17181c; }
      :where(html.theme-dark) .add-row input::placeholder { color:#6f747d; }
      :where(html.theme-dark) .pr-self { background:#1f2126; border-color:#2b2e34; }
      :where(html.theme-dark) .rc-chip.warm { background:transparent; border-color:#3a3e46; color:#8a8f98; }
      :where(html.theme-dark) .aside-dot { color:#4a4f59; }
      :where(html.theme-dark) .pp-photo-dots .pp-dot { background:#3a3e46; }
      :where(html.theme-dark) .fav.pending { border-color:#3a3e46; }
      :where(html.theme-dark) .fav-pending-dot { background:#1c1e22; }
      :where(html.theme-dark) .fav-pending-dot svg { color:#6f747d; }
      :where(html.theme-dark) .qs-empty svg { color:#3a3e46; }
      :where(html.theme-dark) .drag-handle::before { background:linear-gradient(#6f747d,#6f747d) left top/16px 2px no-repeat, linear-gradient(#6f747d,#6f747d) left center/16px 2px no-repeat, linear-gradient(#6f747d,#6f747d) left bottom/16px 2px no-repeat; }
      :where(html.theme-dark) .log-rec.soon { border-color:#3a3e46; }
      /* segmented controls: the "on" chip was solid white */
      :where(html.theme-dark) #vis.seg button.on, :where(html.theme-dark) .seg.wk-seg button.on { background:#3a3e46; color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.4); }
      :where(html.theme-dark) .seg .chip.on, :where(html.theme-dark) .seg button.on { background:rgba(90,139,255,.16); }
      /* -- blue tints -- */
      :where(html.theme-dark) .inv-banner { background:#1b2540; border-color:#2c3c63; }
      :where(html.theme-dark) .inv-card:active { background:#222c4a; }
      :where(html.theme-dark) .inv-card + .inv-card { border-top-color:#2c3c63; }
      :where(html.theme-dark) .chat-row .chat-send, :where(html.theme-dark) .req .ra .sm.ok { background:#1b2540; border-color:#2c3c63; color:var(--blue); }
      :where(html.theme-dark) .btn-quick { background:transparent; }
      :where(html.theme-dark) .btn-quick:active { background:#222c4a; }
      :where(html.theme-dark) .txt-btn:active, :where(html.theme-dark) .add-btn:active { background:rgba(90,139,255,.12); }
      :where(html.theme-dark) .edit-banner { background:rgba(90,139,255,.12); }
      :where(html.theme-dark) .t-warm { background:rgba(90,139,255,.16); }
      :where(html.theme-dark) .drag-placeholder { background:rgba(90,139,255,.08); }
      :where(html.theme-dark) .drag-handle:active { background:rgba(90,139,255,.18); }
      :where(html.theme-dark) .btn-new { box-shadow:0 6px 14px rgba(0,0,0,.4); }
      /* -- greens (recommendation engine, PR moments) -- */
      :where(html.theme-dark) .rp-ic, :where(html.theme-dark) .rc-pr-ic, :where(html.theme-dark) .rc-next-ic, :where(html.theme-dark) .log-rec.up .lr-ic, :where(html.theme-dark) .log-rec.almost .lr-ic, :where(html.theme-dark) .hold-ic.almost-ic { background:rgba(62,207,114,.14); color:var(--green); }
      :where(html.theme-dark) .rc-chip.top { background:rgba(62,207,114,.14); color:var(--green); }
      :where(html.theme-dark) .rp-tag, :where(html.theme-dark) .rc-next-to, :where(html.theme-dark) .drv-p.up, :where(html.theme-dark) .beat-chip { color:var(--green); }
      :where(html.theme-dark) .beat-chip { background:rgba(62,207,114,.14); }
      :where(html.theme-dark) .log-rec.up, :where(html.theme-dark) .rc-pr { background:rgba(62,207,114,.07); border-color:rgba(62,207,114,.25); }
      /* .ex-card kept in the selector here (unlike most :where() overrides in this block) so this
         rule's specificity (0,3,0) matches the light-mode base rule at .ex-card .log-hint.rec-ready
         above instead of losing to it -- :where() itself always contributes zero, so dropping
         .ex-card would leave this at (0,2,0) and the light-mode value would keep winning even in
         dark theme regardless of source order (cold-review catch, v261).
         Jeff, Aug 31, round 3: "on dark mode that green doesn't fit well" -- the usual bright
         --green accent (#3ecf72) reads as neon/loud sitting as plain text in a card this dark and
         muted (other than the accent color itself, this whole screen is grayscale). Toned down to
         #5fae78 -- same hue so it still reads as the same "positive" signal as the light-mode green
         and the log sheet's own box, just quieter -- rather than reusing the accent verbatim. Still
         6.2:1 contrast against the card background (var(--card) dark, #1c1e22), clear of the 4.5:1
         AA floor with room to spare. Light mode is unchanged -- only dark was flagged. */
      :where(html.theme-dark) .ex-card .log-hint.rec-ready { color:#5fae78; }
      :where(html.theme-dark) .log-rec.almost { border-color:rgba(62,207,114,.45); }
      :where(html.theme-dark) .pr-beat { border-color:var(--green); background:rgba(62,207,114,.05); }
      :where(html.theme-dark) .act-chip.done { background:rgba(62,207,114,.16); }
      /* -- amber -> muted gold -- */
      :where(html.theme-dark) .session-live { background:rgba(215,160,74,.06); border-left-color:#d7a04a; }
      :where(html.theme-dark) .live-badge { background:rgba(215,160,74,.15); color:#d7a04a; }
      /* v244/v257 quick-log recording state: same muted gold as the rest of dark's "live" language */
      :where(html.theme-dark) .ql-mic-icon.ql-rec { color:#d7a04a; border-color:#d7a04a; }
      :where(html.theme-dark) .act-chip.act-pr, :where(html.theme-dark) .type-tag.type-tag-pr { background:#1f8a4c; color:#fff; }
      :where(html.theme-dark) .pp-pr { background:#1f8a4c; color:#fff; }
      :where(html.theme-dark) .rc-chip.prfill { background:#1f8a4c; color:#fff; }
      :where(html.theme-dark) .pp-set-n.warm { background:rgba(215,160,74,.15); color:#d7a04a; }
      :where(html.theme-dark) .streak-pill { background:rgba(215,160,74,.13); color:#d7a04a; }
      /* -- reds / drops -- */
      :where(html.theme-dark) .pp-set-n.drop { background:rgba(243,118,106,.15); color:#f3766a; }
      :where(html.theme-dark) .pp-set-n.fail { background:rgba(243,118,106,.18); color:#f3766a; }
      :where(html.theme-dark) .t-fail { background:rgba(243,118,106,.16); }
      :where(html.theme-dark) .t-drop { background:rgba(176,122,255,.16); color:#b07aff; }
      :where(html.theme-dark) .pp-menu button.danger { color:#f3766a; }
      :where(html.theme-dark) .ex-badge.lv-advanced { color:#f3766a; }
      :where(html.theme-dark) .ex-badge.lv-advanced .dot { background:#f3766a; }
      :where(html.theme-dark) .ex-badge.lv-intermediate { color:#d7a04a; }
      :where(html.theme-dark) .ex-badge.lv-intermediate .dot { background:#d7a04a; }
      :where(html.theme-dark) .ex-badge.lv-beginner { color:var(--green); }
      :where(html.theme-dark) .ex-badge.lv-beginner .dot { background:var(--green); }
      :where(html.theme-dark) .ex-badge.ex-type { color:#8a8f98; }
      /* -- text grays -- */
