<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f7f8fa" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <!-- without this every first load asks for /favicon.ico and takes a 404 -->
  <link rel="icon" href="/icon-192.png" />
  <title>CrewFit</title>
  <style>
    /* --avatar is deliberately separate from --green: --green is a heavily-shared token (the
       default button background, checkboxes, "logged" checkmarks, exercise-add buttons, muscle
       icons) with many consumers that were never part of "how avatars look." Repointing --green
       itself to the new graphite would have turned all of those graphite too. --avatar exists so
       the "no photo yet" placeholder can change color on its own, matching this repo's own ink
       color rather than any accent -- see avatarColor() in app.js for why. */
    :root { --bg:#fbfbfd; --card:#ffffff; --fg:#15181f; --muted:#6b7280; --green:#16a34a; --avatar:#2b2f38; --blue:#2563eb; --red:#dc2626; --line:#edeff2; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; padding:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { max-width:480px; margin:0 auto; padding-bottom:calc(72px + env(safe-area-inset-bottom)); }
    .wrap { padding:14px; padding-left:calc(14px + env(safe-area-inset-left)); padding-right:calc(14px + env(safe-area-inset-right)); padding-bottom:calc(84px + env(safe-area-inset-bottom)); }
    .create-flow > .sec.sm { margin:0 0 14px; }            /* Cancel button -> gap below */
    .create-flow > h1 { margin:0 0 16px; }                  /* New workout title -> gap below */
    .tpl-name-edit { width:100%; margin:0 0 16px; font-size:19px; font-weight:700; line-height:1.2; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--text); box-sizing:border-box; }
    .tpl-name-edit:focus { outline:none; border-color:var(--green); }
    .create-flow > label.muted:first-of-type { margin-top:0; }
    h1 { font-size:19px; margin:4px 0 2px; }
    .sess-date { margin:18px 0 4px; }
    .sess-meta { margin:0 0 12px; }
    /* someone else is already training — a fact, not an action, so weight rather than colour
       (green is the avatar accent, blue is CTAs and the active nav tab) */
    .sess-started { margin:9px 2px 2px; font-size:12.5px; font-weight:700; color:var(--fg); }
    /* The host's note. No quote marks and no "— Brian Keith": on this screen you already know
       whose workout it is from the title, Who's in, and the chat, and the card around one short
       sentence was a box doing nothing. Italic is what marks it as something someone said. */
    .sess-note { margin:10px 2px 14px; font-size:13.5px; line-height:1.45; font-style:italic; color:var(--fg); }
    /* The two answers to an invitation. Weighted, in the flow, nothing pinned: this page is barely
       longer than one screen and is seen once, so a fixed bar would cost 68px of permanent chrome
       on top of the 60px nav and crowd the reply box. */
    .btn-answer { width:100%; margin:8px 0 0; padding:14px; border-radius:13px; border:1px solid transparent;
                  background:var(--blue); color:#fff; font-weight:700; font-size:15px; }
    .btn-answer.quiet { background:var(--card); border-color:var(--line); color:var(--muted); font-weight:600; }
    .answer-aside { display:flex; align-items:center; justify-content:center; gap:8px; margin:14px 0 4px; }
    .answer-aside .linkbtn { font-size:13px; }
    .aside-dot { color:#c9cfd8; font-size:13px; }
    .sess-actions { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0 4px; }
    .sess-actions .sm { width:auto; background:transparent; border:1px solid #b0b6c0; color:var(--fg); font-weight:600; }
    /* Jeff, Aug 28: now that Edit/Delete moved into the "..." menu, Log & Finish is the only pill
       left here most of the time -- a light tint read as one option among equals, which was the
       point when it had to share the row with two other pills, but it undersells the one thing
       you actually do on this screen every time. Solid, same as the app's other primary CTAs
       (.btn-primary, button.blue elsewhere), so it reads as THE action, not a suggestion. When
       it's paired with Leave workout (invited, non-creator), this also sharpens that hierarchy
       instead of flattening it -- solid primary vs. outlined secondary, not two same-weight pills. */
    .sess-actions .sm.blue { background:var(--blue); color:#fff; border-color:var(--blue); }
    .sess-actions .sm.sec { border-color:#b0b6c0; color:var(--fg); background:transparent; }
    .home-head { padding-top:calc(22px + env(safe-area-inset-top)); }
    .home-top { display:flex; align-items:center; justify-content:space-between; margin:0 0 16px; }
    .home-brand { font-size:20px; font-weight:700; letter-spacing:.2px; }
    .home-avatar { width:44px; height:44px; border-radius:50%; background:var(--avatar); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; cursor:pointer; object-fit:cover; overflow:hidden; box-shadow:0 2px 8px rgba(20,24,31,.18); }
    .home-greet { font-size:21px; color:var(--fg); font-weight:700; letter-spacing:-0.01em; }
    .home-sub { font-size:13px; color:var(--muted); margin-top:3px; }
    /* v221: adaptive stat row — open on the page, no card box (Jeff: "no windows"). Numbers only
       appear when true; the row itself is omitted with nothing to say. */
    .home-stats { display:flex; margin:2px 0 18px; }
    .hstat { flex:1; min-width:0; }
    .hstat + .hstat { border-left:1px solid var(--line); padding-left:14px; margin-left:14px; }
    .hstat .num { font-size:21px; font-weight:700; letter-spacing:-0.01em; font-variant-numeric:tabular-nums; }
    .hstat .lbl { font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.25; }  /* wraps — a truncated label is a hidden claim */
    /* v222 (Jeff: "when a workout schedules or a friend has activity, THEN it creates the pill
       box"): on Home, a card exists only when there is something real inside it. Cards float on
       shadow alone — no border fence — and an empty section is OPEN on the page: icon + line,
       no container. Discoverability rule intact: the section header and explanation still render,
       nothing is hidden, there is just no box drawn around nothing. */
    .home-head .card { border:none; box-shadow:0 1px 2px rgba(20,24,31,.04), 0 8px 20px -10px rgba(20,24,31,.14); }
    /* Between-section gap must clearly beat the gaps inside a section — with no box to draw the
       boundary, whitespace is the only thing separating groups (Jeff: "does it look clumped?"). */
    .home-empty { text-align:center; padding:14px 16px 4px; margin:2px 0 34px; }
    .home-empty svg { opacity:.5; margin-bottom:8px; }
    .home-empty .he-title { font-weight:600; font-size:13.5px; color:var(--fg); margin:0 0 3px; }
    .home-empty .he-sub { font-size:12.5px; color:var(--muted); margin:0; }
    .home-empty .he-cta { display:inline-block; margin-top:8px; font-size:13px; font-weight:600; color:var(--blue); cursor:pointer; }
    /* v221: the "window" — a faint sky wash at the very top of Home only, fading to the page
       background by ~380px down. Painted on .home-head itself (the wrap spans the whole app
       column, and body is already a 480px column), so it needs no body class, no JS toggling,
       and dies with the page. Not a header gradient rule violation: the header bar itself stays
       flat; this is atmosphere behind the whole top zone of one screen. */
    .home-head { background-image:linear-gradient(180deg, #eef4fd 0%, #f7fafd 55%, rgba(251,251,253,0) 100%); background-repeat:no-repeat; background-size:100% 380px; }
    .act-chip { flex:0 0 auto; font-size:11px; font-weight:700; border-radius:999px; padding:3px 8px; vertical-align:middle; }
    /* was .act-chip.pr — the element also matched the unrelated .pr list-row class used by the
       Progress tab's PR list (line ~564: display:flex, padding:11px 2px, border-bottom). .act-chip
       (0,1,0) and .pr (0,1,0) are equal specificity, and .pr comes later in the file, so its
       display:flex/padding won outright — .act-chip.pr (0,2,0) itself never set either property,
       so there was nothing to out-specificity it with. Result: a full-width 390x35 row instead of
       a small pill (act-chip.done, with no such collision, stayed a normal ~25x18 pill next to it).
       Renamed instead of touching the .pr family, which several other Progress-tab classes
       (.pr-n/.pr-d/.pr-beat/etc.) depend on. Same fix applied to .type-tag.pr below, which had the
       identical collision on the logged-set PR badge. */
    .act-chip.act-pr { background:rgba(245,158,11,.15); color:#b45309; }
    .act-chip.done { background:rgba(16,185,129,.15); color:var(--green); }
    .btn-new { padding:13px 18px; font-size:14px; border-radius:14px; margin:16px 0 8px; width:auto; align-self:flex-start; box-shadow:0 4px 12px rgba(37,99,235,.25); }
    h2 { font-size:12px; margin:28px 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; font-weight:600; }
    h2.light { margin:24px 0 8px; }
    h2.pt { margin-top:84px; }
    h2.sep { margin-top:28px; padding-top:18px; border-top:1px solid var(--line); }
    .inv-banner { background:#f4f8ff; border:1px solid #dbe7fb; border-radius:14px; padding:10px 12px; margin:0 0 16px; }
    /* v222: an empty state gets no box (the box appears when an invite does) */
    .inv-empty { font-size:12.5px; color:var(--muted); padding:0 2px; margin:0 0 16px; }
    /* A pending invite on the home screen. Deliberately NOT called .inv-row: that name belongs to
       the friend picker in New Workout further down this file, and while these two shared it the
       picker's padding, gap and border-bottom silently applied here — two invites drew a double
       divider, and the picker's cursor:pointer was the only reason this looked tappable. */
    /* padding is on the row, not on the sibling, so BOTH rows press with the same shaped highlight;
       the negative margin lets that highlight and the divider run the full width of the banner */
    .inv-card { display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; border-radius:10px; padding:8px 6px; margin:0 -6px; }
    .inv-card:active { background:#e8f1ff; }
    /* pressing Accept or Decline must NOT flash "opening the workout" at you — :active matches
       ancestors, so the row lights up for a button press unless this cancels it */
    .inv-card:has(.inv-actions:active) { background:transparent; }
    .inv-card + .inv-card { border-top:1px solid #e6eefb; }
    .inv-info { font-size:13px; color:var(--fg); line-height:1.35; }
    .inv-info .tag { margin-top:2px; }
    /* the row opens the workout — say so, since a phone has no cursor to hint with */
    .inv-open { font-size:11.5px; font-weight:600; color:var(--blue); margin-top:4px; }
    /* .row also sets a gap and is declared later, so this has to be .row.inv-actions to win */
    .row.inv-actions { justify-content:flex-end; gap:6px; flex:0 0 auto; }
    /* the two buttons are a pair, so they must be one size: .gray carries a real 1px border and
       .blue does not, which made them 2px different in both dimensions and 1px off each other */
    .inv-actions button.sm { border:1px solid transparent; }
    .inv-actions button.sm:active { filter:brightness(.93); }
    .feed-strip { display:flex; flex-direction:column; gap:2px; }
    .feed-item { font-size:13px; color:var(--fg); line-height:1.5; padding:7px 0; border-bottom:1px solid var(--line); }
    .feed-item:last-child { border-bottom:none; }
    .muted { color:var(--muted); font-size:12px; }
    .sm-text { font-size:11px; }
    .swap-note { font-size:11px; color:var(--muted); font-weight:400; }
    button { font:inherit; border:none; border-radius:12px; padding:11px; background:var(--green); color:#fff; font-weight:600; width:100%; margin:6px 0; cursor:pointer; font-size:14px; }
    button.sec { background:var(--card); color:var(--fg); border:1px solid var(--line); }
    button.blue { background:var(--blue); color:#fff; }
    button.red { background:var(--red); color:#fff; }
    button.sm { padding:7px 12px; width:auto; font-size:12px; border-radius:9px; margin:0; }
    button.sm.gray { background:var(--card); color:var(--fg); border:1px solid var(--line); }
    .tpl-actions { display:flex; justify-content:center; gap:10px; margin-top:10px; }
    .linkbtn { background:transparent; color:var(--blue); font-weight:600; width:auto; padding:5px; margin:0; font-size:13px; }
    input,select { width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); margin:5px 0; font:inherit; font-size:14px; }
    textarea { width:100%; box-sizing:border-box; padding:9px 11px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; font-size:13px; resize:none; min-height:60px; }
    .btn-primary { width:100%; box-sizing:border-box; margin-top:18px; padding:14px; border-radius:12px; border:none; background:var(--blue); color:#fff; font:inherit; font-size:15px; font-weight:700; cursor:pointer; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:8px 14px; margin:12px 0; box-shadow:0 6px 18px rgba(20,24,31,.06); }
    .notes-box { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 11px; margin:10px 0; font-family:inherit; font-size:13px; line-height:1.45; color:var(--fg); min-height:60px; box-sizing:border-box; }
    /* Posted-workout (read-only post) view */
    .pp-head { display:flex; align-items:center; justify-content:space-between; gap:10px; position:relative; }
    .pp-dots { background:transparent; border:none; font-size:22px; line-height:1; color:var(--fg); cursor:pointer; padding:2px 8px; border-radius:8px; width:auto; flex:0 0 auto; margin-left:auto; }
    .pp-dots:active { background:#f1f3f6; }
    .pp-menu { position:absolute; top:40px; right:0; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.12); z-index:20; min-width:170px; overflow:hidden; }
    .pp-menu button { display:block; width:100%; text-align:left; background:transparent; border:none; padding:12px 15px; font-size:14px; color:var(--fg); cursor:pointer; }
    .pp-menu button:active { background:#f1f3f6; }
    .pp-menu button.danger { color:#d23; }
    .pp-photos { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; border-radius:12px; scrollbar-width:none; }
    .pp-photos::-webkit-scrollbar { display:none; }
    .pp-photos img, .pp-photos video { flex:0 0 100%; width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px; display:block; background:#e6e8ec; scroll-snap-align:start; }
    .pp-photo { position:relative; flex:0 0 100%; }
    .pp-photo-x { position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; border:none; font-size:15px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:5; }
    .pp-photo-dots { display:flex; gap:6px; justify-content:center; margin-top:8px; }
    .pp-photo-dots .pp-dot { width:6px; height:6px; border-radius:50%; background:#cfd4da; transition:background .15s; }
    .pp-photo-dots .pp-dot.on { background:var(--blue); }
    .pp-ex { display:flex; justify-content:space-between; align-items:center; padding:11px 4px; border-bottom:1px solid var(--line); }
    .pp-ex:last-child { border-bottom:none; }
    .pp-ex-name { font-size:14px; font-weight:600; color:var(--fg); }
    .pp-sets { margin:5px 0 2px; padding-left:2px; }
    /* whose sets these are — only rendered when more than one person logged, so a solo
       workout is byte-identical to how it looked before */
    .pp-who { font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase;
              letter-spacing:.5px; margin:9px 0 1px; padding-left:2px; }
    /* the lift as it was named when THEY logged it, if a swap has since renamed it */
    .pp-who-note { font-weight:600; text-transform:none; letter-spacing:0; opacity:.8; }
    .pp-set { display:flex; align-items:center; gap:8px; padding:3px 0; font-size:13px; }
    /* Jeff, Aug 28: tap-to-edit affordance on your own logged sets on a posted workout (never
       another participant's -- setRows() in app.js only sets this class when mine===true). */
    .pp-set-mine { cursor:pointer; }
    .pp-set-edit { margin-left:auto; flex:0 0 auto; }
    .pp-set-n { width:22px; height:22px; border-radius:6px; background:#eef1f5; color:var(--muted); font-size:11px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
    .pp-set-n.warm { background:#fff3e0; color:#b26a00; }
    .pp-set-n.drop { background:#ffe8e0; color:#c2410c; }
    .pp-set-n.fail { background:#fde2e2; color:#b91c1c; }
    .pp-set-val { color:var(--fg); }
    .pp-pr { font-size:10px; font-weight:700; color:#b8860b; background:#fff8e1; border-radius:6px; padding:1px 6px; }
    .pp-collab { font-size:12px; color:var(--blue); margin:2px 0 10px; }
    .row { display:flex; gap:8px; align-items:center; }
    .row > * { flex:1; }
    .chat-row { align-items:center; }
    .chat-row > * { flex:initial; }
    .chat-input { flex:1; height:44px; padding:0 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; font-size:14px; }
    .chat-row .chat-send { flex:0 0 auto; height:44px; display:flex; align-items:center; justify-content:center; padding:0 18px; line-height:1; border-radius:12px; background:#e8f1ff; color:var(--blue); border:1px solid #bcd4fb; font-weight:600; }
    .pill { display:inline-block; background:#eef1f5; border-radius:999px; padding:3px 9px; font-size:11px; margin:3px 4px 3px 0; color:var(--muted); }
    .tag { font-size:11px; color:var(--muted); }
    .hidden { display:none !important; }
    .scrolllist { max-height:46vh; overflow:auto; }
    .lib-item { display:flex; justify-content:space-between; align-items:center; padding:10px 6px; border-bottom:1px solid var(--line); font-size:14px; }
    .lib-item:active { background:#f1f3f6; }
    .lib-item { gap:10px; }
    .card > .lib-item:last-child, .scrolllist > .lib-item:last-child { border-bottom:none; }
    .mw-thumb { width:52px; height:52px; border-radius:10px; object-fit:cover; flex:0 0 auto; background:#e9edf2; }
    .badge { background:var(--blue); color:#fff; border-radius:999px; padding:2px 8px; font-size:11px; }
    /* A count badge sitting beside an <h1> (e.g. pending follow requests on Friends): the
       heading text and a tiny pill don't share a baseline by default, so this row centers
       them on the cross-axis and gives the pill real proportions instead of a squashed
       inline span riding low next to 19px text. */
    .h1-row { display:flex; align-items:center; gap:8px; margin:4px 0 2px; }
    .h1-row h1 { margin:0; }
    .h1-row .badge { min-width:20px; height:20px; padding:0 6px; font-size:12px; font-weight:700;
      display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box; }
    .chips { display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin:8px 0 4px; }
    .chips .lbl { color:var(--muted); font-size:11px; margin-right:2px; }
    .chip { background:#eef1f5; color:var(--fg); border:1px solid var(--line); border-radius:999px; padding:5px 10px; font-size:12px; cursor:pointer; }
    .chip.on { background:var(--blue); color:#fff; border-color:var(--blue); }
    .chips.mini { gap:8px; }
    .fav { display:inline-flex; align-items:center; gap:7px; background:#eef1f5; border:1px solid var(--line); border-radius:999px; padding:4px 11px 4px 4px; }
    .fav-av { width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:0 0 auto; }
    /* Comments thread */
    .cmt { display:flex; gap:9px; padding:9px 6px; border-bottom:1px solid var(--line); }
    .cmt:last-child { border-bottom:none; }
    .cmt-av { width:30px; height:30px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:0 0 auto; }
    .cmt-body { flex:1 1 auto; min-width:0; }
    .cmt-top { display:flex; align-items:center; gap:8px; }
    .cmt-top b { font-size:13px; }
    .cmt-text { font-size:13px; color:var(--fg); margin-top:2px; line-height:1.35; word-wrap:break-word; }
    /* ---- Save workout page ---- */
    .card.center-v { padding:14px; line-height:1.4; }
    .add-media { display:inline-flex; align-items:center; justify-content:center; width:64px; height:64px; border-radius:12px; border:1px solid var(--line); background:#fafbfc; color:var(--blue); cursor:pointer; position:relative; flex:0 0 auto; vertical-align:middle; }
    .add-media .am-ic { width:28px; height:28px; }
    .add-media .am-plus { position:absolute; right:-5px; bottom:-5px; width:20px; height:20px; border-radius:50%; background:var(--blue); border:2px solid #fff; display:flex; align-items:center; justify-content:center; }
    .add-media .am-plus::before, .add-media .am-plus::after { content:''; position:absolute; background:#fff; border-radius:1px; }
    .add-media .am-plus::before { width:9px; height:2px; }
    .add-media .am-plus::after { width:2px; height:9px; }
    .media-line { display:flex; align-items:center; justify-content:flex-start; gap:8px; flex-wrap:nowrap; line-height:normal; }
    .media-line .ml-text { font-size:13px; color:var(--fg); font-weight:600; }
    .thumbs { display:flex; gap:8px; margin:0; flex-wrap:nowrap; flex:0 0 auto; }
    .thumbs:empty { display:none; }
    .thumb { width:64px; height:64px; border-radius:10px; background:#e9edf2; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted); position:relative; overflow:hidden; flex:0 0 auto; }
    .thumb img, .thumb video { width:100%; height:100%; object-fit:cover; }
    .thumb .x { position:absolute; top:2px; right:4px; color:#fff; background:rgba(0,0,0,.5); border-radius:50%; width:17px; height:17px; display:flex; align-items:center; justify-content:center; font-size:10px; }
    .tab-note { font-size:11px; color:var(--muted); margin-top:8px; }
    .fineprint { font-size:10.5px; color:#9aa1ad; line-height:1.45; padding:7px 2px 0; letter-spacing:.1px; }
    .fav span { font-size:13px; font-weight:600; color:var(--fg); }
    .ex-card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 14px 12px; margin:13px 0; box-shadow:0 1px 3px rgba(0,0,0,.04); }

    #vis.seg button.on { background:#fff; color:var(--blue); box-shadow:0 1px 2px rgba(0,0,0,.08); }
    /* match mock exactly */
    .save-page .card { padding:12px 14px; }
    .save-page textarea { min-height:56px; }
    .save-page h2 { margin:18px 0 8px; }
    .add-row { display:flex; gap:8px; align-items:center; width:100%; margin-top:2px; }
    .add-row input { margin:0; flex:1 1 0; min-width:0; max-width:100%; box-sizing:border-box; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; background:#fbfbfc; color:var(--fg); }
    .add-row input::placeholder { color:#aeb4be; }
    .add-btn { flex:0 0 auto; width:auto; margin:0; background:transparent; color:var(--blue); border:1px solid var(--blue); border-radius:10px; padding:11px 16px; font-size:14px; font-weight:600; }
    .add-btn:active { background:rgba(37,99,235,.08); }
    .rest { display:inline-flex; align-items:center; gap:8px; margin-top:14px; padding:8px 12px; background:#eef1f5; border-radius:999px; font-size:12px; color:var(--muted); }
    .rest b { color:var(--fg); font-size:14px; font-weight:700; }
    .note { font-size:11px; color:var(--muted); margin-top:14px; }
    /* Load-type note under the weight box: says what the number means, and for a pair
       shows the doubled total live so the convention never has to be reasoned about. */
    .log-rec { display:flex; align-items:center; flex-wrap:wrap; gap:4px 8px; margin:0 0 12px;
      padding:10px 12px; border-radius:12px; font-size:13px; cursor:pointer; }
    .log-rec.up { background:rgba(6,122,6,.07); border:1px solid rgba(6,122,6,.22); }
    /* Three steps, and the fill is what says which: DASHED = not yet, SOLID = a verdict.
       .soon (dashed grey, no fill) nothing to advise yet · .almost (dashed green) one session
       away · .up (solid green) go, and it is the only one that is tappable. No brand blue in
       any of them — blue is the CTA colour and none of these are CTAs. */
    /* ---- workout recap (showRecap) — seen once after Log & Finish ---- */
    .rc-wrap { padding-top:calc(18px + env(safe-area-inset-top)); }
    .rc-h1 { font-size:22px; font-weight:700; margin:2px 0 2px; letter-spacing:-.2px; }
    .rc-sub { font-size:13px; color:var(--muted); margin:0 0 14px; }
    .rc-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:0 0 14px; }
    .rc-tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 10px;
               box-shadow:0 6px 18px rgba(20,24,31,.06); text-align:center; }
    .rc-n { font-size:21px; font-weight:700; letter-spacing:-.4px; line-height:1.1; }
    .rc-n small { font-size:11px; font-weight:600; color:var(--muted); margin-left:2px; }
    .rc-l { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-top:3px; font-weight:600; }
    .rc-pr { display:flex; align-items:flex-start; gap:10px; background:rgba(6,122,6,.07);
             border:1px solid rgba(6,122,6,.22); border-radius:14px; padding:11px 12px; margin:0 0 14px; }
    .rc-pr-ic { flex:0 0 auto; width:26px; height:26px; border-radius:8px; background:rgba(6,122,6,.15);
                color:#067a06; display:flex; align-items:center; justify-content:center; font-size:14px; }
    .rc-pr-t { font-size:14px; font-weight:700; }
    .rc-pr-s { font-size:12px; color:var(--muted); margin-top:1px; line-height:1.5; }
    .rc-ex { padding:11px 2px; border-bottom:1px solid var(--line); }
    .rc-ex:last-child { border-bottom:none; }
    .rc-ex-top { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
    .rc-ex-n { font-size:14.5px; font-weight:600; }
    .rc-ex-best { font-size:12px; color:var(--muted); flex:0 0 auto; }
    .rc-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
    .rc-chip { font-size:12px; font-weight:600; padding:4px 9px; border-radius:8px; background:#f1f3f6; color:var(--fg); }
    .rc-chip.top { background:rgba(6,122,6,.12); color:#067a06; }
    .rc-chip.warm { background:transparent; border:1px dashed #d6dae1; color:var(--muted); font-weight:500; }
    .rc-chip .star { margin-left:3px; }
    .rc-note { font-size:11px; color:var(--muted); padding:9px 2px 0; }
    .rc-next { padding:11px 2px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:11px; }
    .rc-next:last-child { border-bottom:none; }
    .rc-next-ic { flex:0 0 auto; width:27px; height:27px; border-radius:8px; background:rgba(6,122,6,.12);
                  color:#067a06; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; }
    .rc-next-m { flex:1; min-width:0; }
    .rc-next-n { font-size:14px; font-weight:600; }
    .rc-next-w { font-size:11.5px; color:var(--muted); margin-top:1px; }
    .rc-next-to { font-size:15px; font-weight:700; color:#067a06; flex:0 0 auto; }
    .rc-cta { display:flex; gap:10px; margin:18px 0 6px; }
    .rc-cta button { margin:0; width:auto; min-height:48px; border-radius:12px; font-size:15px; font-weight:700; }
    .rc-cta .rc-prim { flex:1 1 auto; background:var(--blue); color:#fff; }
    .rc-cta .rc-done { flex:0 0 auto; padding:0 20px; background:var(--card); color:var(--fg); border:1px solid var(--line); font-weight:600; }
    .log-rec.soon   { background:transparent; border:1px dashed #ccd2db; cursor:default; }
    .log-rec.almost { background:transparent; border:1px dashed rgba(6,122,6,.45); cursor:default; }
    .log-rec.hold { background:#f4f6f9; border:1px solid var(--line); cursor:default; }
    .log-rec .lr-ic { width:22px; height:22px; border-radius:7px; display:flex; align-items:center;
      justify-content:center; font-weight:800; font-size:13px; flex:0 0 auto; }
    .log-rec.up .lr-ic { background:rgba(6,122,6,.15); color:#067a06; }
    .log-rec.soon .lr-ic   { background:#f1f3f6; color:var(--muted); }
    .log-rec.almost .lr-ic { background:rgba(6,122,6,.12); color:#067a06; }
    .log-rec.hold .lr-ic { background:#e6e9ee; color:var(--muted); }
    .log-rec .lr-t { font-weight:600; color:var(--fg); }
    .log-rec .lr-why { font-size:11.5px; color:var(--muted); flex:1 1 100%; padding-left:30px; }
    .log-rec.used { opacity:.5; }
    .load-note { display:flex; align-items:center; gap:8px; margin:8px 2px 0; flex-wrap:wrap; }
    .load-chip { font-size:10.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
                 color:var(--muted); background:#eef1f5; border-radius:6px; padding:3px 8px; }
    .load-hint { font-size:11.5px; color:var(--muted); }
    /* Inline workout edit mode */
    .edit-mode { padding-bottom:84px; }
    .edit-banner { position:sticky; top:0; z-index:30; background:rgba(37,99,235,.10); color:var(--blue); font-weight:600; font-size:13px; text-align:center; padding:8px; border-radius:10px; margin-bottom:10px; }
    .inex-row { margin-bottom:10px; }
    .inex-top { display:flex; align-items:center; gap:8px; }
    .inex-name { flex:1; min-width:0; padding:9px 11px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; font-size:14px; }
    .inex-meta { display:flex; align-items:center; gap:8px; margin-top:8px; }
    .inex-meta label { font-size:12px; }
    .inex-num { width:62px; padding:7px 9px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; font-size:14px; }
    .sticky-bar { position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex; align-items:stretch; gap:10px; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid var(--line); box-shadow:0 -2px 10px rgba(0,0,0,.06); }
    .sticky-bar button { flex:1 1 0; width:auto; min-height:46px; display:inline-flex; align-items:center; justify-content:center; margin:0; }
    .sticky-bar .btn-primary { font-size:15px; }
    .sticky-bar .sec { font-size:15px; }
    /* Saved workout (Hevy-style): square photo grid above, clean exercise list below */
    .saved-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:10px 0; }
    .saved-grid .sq { position:relative; aspect-ratio:1/1; border-radius:0; overflow:hidden; background:#e6e8ec; }
    .saved-grid .sq img { width:100%; height:100%; object-fit:cover; display:block; }
    .saved-grid .sq video { width:100%; height:100%; object-fit:cover; display:block; }
    .saved-grid .sq.add { display:flex; align-items:center; justify-content:center; border:1px dashed var(--line); color:var(--muted); font-size:24px; font-weight:300; cursor:pointer; }
    .saved-grid .more { position:absolute; inset:0; background:rgba(0,0,0,.45); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; }
    .ex-list { margin:10px 0; }
    .ex-line { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
    .ex-line:last-child { border-bottom:none; }
    .ex-idx { flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:#eef1f5; color:var(--muted); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; }
    .ex-body { flex:1; min-width:0; }
    .ex-title { font-size:15px; font-weight:600; }
    .ex-detail { font-size:12.5px; color:var(--muted); margin-top:2px; }
    .ex-wt { flex:0 0 auto; font-size:13px; font-weight:600; color:var(--fg); }
    /* Friends feed (Hevy-style social cards) */
    .feed-card { background:var(--card); border:1px solid var(--line); border-radius:14px; margin:10px 0; overflow:hidden; }
    .feed-top { display:flex; align-items:center; gap:10px; padding:11px 12px; }
    .feed-av { width:40px; height:40px; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex:0 0 auto; }
    .feed-name { font-weight:600; font-size:14px; }
    .feed-sub { font-size:12px; color:var(--muted); }
    .feed-cover { width:100%; height:160px; object-fit:cover; display:block; background:#e6e8ec; }
    .feed-body { padding:10px 12px 12px; }
    .feed-title { font-weight:700; font-size:15px; margin-bottom:4px; }
    .feed-ex { font-size:13px; color:var(--muted); }
    .feed-ex b { color:var(--fg); }
    .tag-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .tag-pill { font-size:11px; background:var(--blue-bg); color:var(--blue); border-radius:999px; padding:3px 9px; font-weight:600; }
    /* Profile workout GRID (toggle view) */
    .wgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .wgrid.wlist { grid-template-columns:1fr; }
    /* Deliberately NO shadow here: Jeff reviewed the elevated-card treatment for Profile and chose to
       keep the flatter look. It is also unsafe at this geometry — an 18px-blur shadow across the 12px
       .wgrid gutter never clears back to page background, so the 2x2 grid reads as one gray slab
       rather than four cards. If elevation is wanted later, tighten to ~0 2px 8px AND widen the gutter. */
    .wtile { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer; display:flex; flex-direction:column; padding:10px; }
    .wdate { font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.02em; }
    .wtitle { font-size:16px; font-weight:700; color:var(--fg); line-height:1.2; margin-top:8px; }
    .wthumb { width:100%; aspect-ratio:3/2; object-fit:cover; border-radius:10px; background:#e6e8ec; display:block; margin:8px 0; }
    .wthumb-empty { background:linear-gradient(135deg,#eef1f6,#e2e7ee); }
    .wex { margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
    .wex-h { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
    .wexb { margin:0; padding-left:0; list-style:none; counter-reset:ex; }
    .wexb li { position:relative; font-size:13px; color:var(--fg); line-height:1.5; padding-left:22px; margin-bottom:3px; }
    .wexb li::before { counter-increment:ex; content:counter(ex); position:absolute; left:0; top:1px; width:16px; height:16px; border-radius:5px; background:#eceef1; color:#6b7280; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }
    .wexb-more { font-size:11px; color:var(--muted); margin-top:4px; padding-left:22px; }
    .wexnone { font-size:12px; color:var(--muted); }
    .wcollab { font-size:11px; color:var(--muted); margin-top:8px; }
    .tcollab { display:inline-block; margin-top:3px; font-size:10px; font-weight:700; color:var(--blue); background:var(--blue-bg); border-radius:999px; padding:1px 7px; }
    .view-toggle { display:inline-flex; gap:6px; margin-left:auto; }
    /* inline-flex + nowrap + line-height:1 keeps the icon beside the label on ONE line,
       so both buttons share a baseline and match in size (they wrapped differently before). */
    .view-toggle button { display:inline-flex; align-items:center; justify-content:center; gap:5px; white-space:nowrap; min-width:68px; height:32px; padding:0 12px; line-height:1; border:1px solid var(--line); background:#fff; color:var(--muted); font-size:12px; font-weight:600; border-radius:9px; cursor:pointer; margin:0; width:auto; }
    .view-toggle button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
    .sec-head { display:flex; align-items:center; }
    /* ---- Progress tab ---- */
    .grp + .grp { margin-top:4px; padding-top:10px; border-top:1px solid var(--line); }
    .grp-h { font-size:10.5px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--muted); padding:2px 2px 4px; }
    .rp { display:flex; align-items:center; gap:11px; padding:12px 2px; border-bottom:1px solid var(--line); }
    .rp:last-child { border-bottom:none; }
    .rp-ic { flex:0 0 auto; width:27px; height:27px; border-radius:8px; background:rgba(6,122,6,.11); color:#067a06; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; }
    .rp-main { flex:1; min-width:0; }
    .rp-name { font-size:14.5px; font-weight:600; }
    .rp-why { font-size:11.5px; color:var(--muted); margin-top:2px; }
    .rp-to { flex:0 0 auto; text-align:right; }
    .rp-new { font-size:15px; font-weight:700; color:var(--fg); }
    .rp-tag { font-size:10px; font-weight:700; color:#067a06; text-transform:uppercase; letter-spacing:.4px; margin-top:2px; }
    .hold-sec { margin-top:4px; padding-top:10px; border-top:1px solid var(--line); }
    .hold-head { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; padding:2px 2px 0; }
    .hold { display:flex; align-items:center; gap:11px; padding:11px 2px 2px; }
    .hold-ic { flex:0 0 auto; width:27px; height:27px; border-radius:8px; background:#eef1f5; color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; }
    /* "Almost" is a positive state and must not read as the negative one directly below it. */
    .hold-ic.almost-ic { background:rgba(6,122,6,.12); color:#067a06; }
    .rulenote { font-size:11.5px; color:var(--muted); line-height:1.55; padding:11px 2px 0; border-top:1px solid var(--line); margin-top:8px; }
    .rulenote b { color:var(--fg); font-weight:700; }
    .kpi { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; }
    .hero { font-size:30px; font-weight:700; line-height:1; letter-spacing:-.5px; }
    .hero-u { font-size:14px; color:var(--muted); font-weight:600; }
    .hero-cap { font-size:11.5px; color:var(--muted); margin-top:4px; }
    .streak { display:inline-flex; align-items:center; gap:4px; background:#eef1f5; color:var(--fg); border-radius:999px; padding:4px 10px; font-size:11.5px; font-weight:600; }
    .pr { display:flex; justify-content:space-between; align-items:center; padding:11px 2px; border-bottom:1px solid var(--line); }
    .pr:last-child { border-bottom:none; }
    .pr-n { font-size:14px; font-weight:600; }
    .pr-d { font-size:11px; color:var(--muted); margin-top:2px; }
    .pr-r { text-align:right; }
    .pr-w { font-size:14px; font-weight:700; }
    .pr-self { background:#fbfcfd; border-left:3px solid #dfe3e9; padding-left:9px; margin-left:-3px; border-radius:0 8px 8px 0; }
    .self-tag { font-size:9.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); background:#eef1f5; border-radius:5px; padding:2px 6px; margin-left:5px; vertical-align:1.5px; }
    .pr-goal { font-size:11px; color:var(--blue); font-weight:700; margin-top:2px; }
    .pr-beat { background:rgba(6,122,6,.045); border-left:3px solid #067a06; padding-left:9px; margin-left:-3px; border-radius:0 10px 10px 0; }
    .pr-beat-was { font-size:11.5px; color:var(--muted); margin-top:3px; }
    .pr-beat-was b { color:var(--fg); font-weight:700; }
    .beat-chip { display:inline-block; margin-top:4px; font-size:10px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; color:#fff; background:#067a06; border-radius:6px; padding:3px 7px; }
    .empty { text-align:center; padding:8px 6px 6px; }
    .empty-ic { width:42px; height:42px; margin:0 auto 10px; border-radius:12px; background:#eef1f5; color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:19px; }
    .empty-t { font-size:15px; font-weight:700; }
    .empty-b { font-size:12.5px; color:var(--muted); line-height:1.5; margin:6px auto 0; max-width:275px; }
    .empty-b b { color:var(--fg); }
    .chips { display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none; }
    .chips::-webkit-scrollbar { display:none; }
    .ch-head { display:flex; align-items:baseline; justify-content:space-between; }
    .ch-val { font-size:26px; font-weight:700; letter-spacing:-.4px; }
    .ch-unit { font-size:12px; color:var(--muted); font-weight:600; }
    .ch-note { font-size:11.5px; color:var(--muted); margin:3px 0 12px; }
    .tblnote { font-size:11px; color:var(--muted); padding:10px 2px 0; line-height:1.5; border-top:1px solid var(--line); margin-top:10px; }
    .drv-head { font-size:10.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin:14px 0 2px; padding-top:12px; border-top:1px solid var(--line); }
    .drv { display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line); }
    .drv:last-child { border-bottom:none; }
    .drv-n { flex:1; min-width:0; font-size:13.5px; font-weight:600; }
    .drv-w { font-size:11.5px; color:var(--muted); white-space:nowrap; }
    .drv-p { width:52px; text-align:right; font-size:13px; font-weight:700; }
    .drv-p.up { color:#067a06; } .drv-p.flat { color:var(--muted); }
    .eg-wrap { margin-top:16px; padding-top:12px; border-top:1px dashed var(--line); text-align:left; }
    .eg-cap { font-size:10px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
              color:var(--muted); text-align:center; margin-bottom:2px; }
    .eg-row { opacity:.45; border-bottom:none; }
    :root { --s1:#cde2fb; --s2:#9ec5f4; --s3:#5598e7; --s4:#2563eb; }
    /* compact segmented track, matching the save-page visibility control rather than the
       chunky pill row used for set types — a range switch shouldn't outweigh the chart */
    .seg.wk-seg { background:#eef1f5; border-radius:10px; padding:3px; gap:0; margin:14px 0 2px; }
    .seg.wk-seg button { flex:1; border:none; background:transparent; padding:8px 4px; border-radius:8px;
      font:inherit; font-size:12.5px; font-weight:600; color:var(--muted); margin:0; }
    .seg.wk-seg button.on { background:#fff; color:var(--blue); box-shadow:0 1px 2px rgba(0,0,0,.08); }
    /* Home: "+ New workout" (primary) paired with "Quick Workout" (secondary quick-start) */
    .home-actions { display:flex; gap:10px; align-items:center; margin:16px 0 8px; flex-wrap:wrap; }
    .home-actions .btn-new { margin:0; }
    /* padding is 1.5px shorter than .btn-new's on each side, on purpose: .btn-new has no border
       and .btn-quick has a 1.5px one, so equal padding would make .btn-quick 3px taller — this
       keeps both buttons the same height and baseline-aligned (see the .inv-actions comment above
       for the same bug in the Accept/Decline pair). */
    .btn-quick { width:auto; margin:0; padding:12px 16.5px; font-size:14px; border-radius:14px; background:#fff; color:var(--blue); border:1.5px solid var(--blue); display:inline-flex; align-items:center; gap:7px; font-weight:700; }
    .btn-quick svg { width:16px; height:16px; flex:0 0 auto; }
    .btn-quick:active { background:#eef4ff; }
    /* Workout detail: pending invitees, distinct from joined "Who's in" chips */
    .crew-invited-label { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin:12px 0 6px 2px; }
